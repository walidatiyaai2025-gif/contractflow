name: Worker3 Format Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format affected Worker 3 sources
        run: |
          dart format \
            lib/features/finance/finance_screen.dart \
            lib/features/notifications/notifications_screen.dart
      - name: Persist formatter corrections
        working-directory: .
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile/lib/features/finance/finance_screen.dart \
            mobile/lib/features/notifications/notifications_screen.dart
          if git diff --cached --quiet; then
            echo "Worker 3 sources already formatted."
          else
            git commit -m "style(mobile): apply worker3 formatter corrections"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
