name: ESC P9-019 Diagnostic Capture

on:
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production
      - name: Capture fixture query order
        run: |
          set +e
          php tests/php/enterprise_contract_financial_schedule_coverage_p9_019_diag.php > tests/php/.p9019_diag_capture.txt 2>&1
          status=$?
          set -e
          printf '\nDIAG_EXIT=%s\n' "$status" >> tests/php/.p9019_diag_capture.txt
          git config user.name safecontracts-bot
          git config user.email safecontracts-bot@users.noreply.github.com
          git add tests/php/.p9019_diag_capture.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(p9-019): capture temporary fixture diagnostic'
          git push origin HEAD:${{ github.head_ref }}
