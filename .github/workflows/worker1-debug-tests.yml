name: Worker 1 Test Failure Capture

on:
  push:
    branches:
      - mobile-redesign/foundation-auth-navigation

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-redesign/foundation-auth-navigation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Capture expanded test failure
        shell: bash
        run: |
          set +e
          cd mobile
          flutter test -r expanded > /tmp/worker1-test.log 2>&1
          status=$?
          cd ..
          echo "exit_code=$status" > docs/mobile-redesign/WORKER1_TEST_FAILURE.txt
          tail -n 220 /tmp/worker1-test.log >> docs/mobile-redesign/WORKER1_TEST_FAILURE.txt
          exit 0
      - name: Commit diagnostic and remove temporary workflow
        shell: bash
        run: |
          git config user.name "safecontracts-bot"
          git config user.email "safecontracts-bot@users.noreply.github.com"
          git add docs/mobile-redesign/WORKER1_TEST_FAILURE.txt
          git rm .github/workflows/worker1-debug-tests.yml
          git commit -m "chore(worker1): capture Flutter test failure"
          git push origin HEAD:mobile-redesign/foundation-auth-navigation
