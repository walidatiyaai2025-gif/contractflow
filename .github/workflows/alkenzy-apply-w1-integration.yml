name: ALKENZY Apply W1 Integration Closure

on:
  push:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  apply-w1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-reference-redesign
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply validate and commit W1 production closure
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=bootstrap
          fail() {
            rc=$?
            set +e
            printf 'stage=%s\nhead=%s\nexit=%s\n' "$stage" "$(git rev-parse HEAD)" "$rc" > .github/ALKENZY_W1_FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ALKENZY_W1_FAILURE.txt
            git commit -m "ci(w1): record integrated closure failure at $stage" || true
            git push origin HEAD:feat/alkenzy-mobile-reference-redesign || true
            exit "$rc"
          }
          trap fail ERR

          stage=normalize-generator
          cp scripts/w1_bug_closure_patch.py /tmp/w1_bug_closure_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/w1_bug_closure_patch.py')
          text = p.read_text()
          text = text.replace(
              'next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'next_text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=flags)',
          )
          text = text.replace('destination == this.selected', 'destination == selected')
          bad_edit = '"label: Text(context.scL10n.t(\'Edit\')),' + chr(10) + '",'
          text = text.replace(bad_edit, '"label: Text(context.scL10n.t(\'Edit\')),\\n",')
          text = text.replace(
              r": '$fallback\n${rawError.trim()}';",
              r": '$fallback\\n${rawError.trim()}';",
          )
          p.write_text(text)
          PY
          python3 -m py_compile /tmp/w1_bug_closure_patch.py

          stage=apply-production
          python3 /tmp/w1_bug_closure_patch.py

          stage=dependencies
          cd mobile
          flutter pub get

          stage=format
          dart format lib test

          stage=analyze
          flutter analyze

          stage=tests
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
          cd ..

          stage=commit
          rm -f .github/workflows/alkenzy-apply-w1-integration.yml
          rm -f .github/workflows/w1-reconcile-latest-integration.yml
          rm -f scripts/w1_bug_closure_patch.py
          rm -f .github/ALKENZY_W1_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(w1): close customer navigation bugs on integrated exact head"
          git push origin HEAD:feat/alkenzy-mobile-reference-redesign

      - name: Capture W1 AR EN responsive evidence
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          for language in ar en; do
            for width in 320 360 375 390 412 430; do
              flutter test test/worker1_visual_capture_test.dart \
                --dart-define=W1_CAPTURE_WIDTH="$width" \
                --dart-define=W1_CAPTURE_LANG="$language"
            done
          done

      - name: Upload W1 responsive evidence
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-w1-integrated-responsive-evidence
          path: mobile/build/w1-bug-closure/*.png
          if-no-files-found: error
          retention-days: 14
