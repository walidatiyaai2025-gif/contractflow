name: SafeContracts Plan Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/plan_config.py'
      - 'scripts/seed_plan_issues.py'
      - 'scripts/update_project_status.py'
      - 'scripts/build_docx.py'
      - 'docs/MASTER_PLAN.md'
      - 'docs/DEVELOPMENT_ROADMAP.md'
      - '.github/workflows/plan-sync.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: safecontracts-plan-sync
  cancel-in-progress: false

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Seed missing GitHub tasks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/seed_plan_issues.py

      - name: Build Word document
        run: python scripts/build_docx.py

      - name: Refresh live project table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_project_status.py

      - name: Commit generated plan artifacts
        run: |
          git config user.name "safecontracts-bot"
          git config user.email "safecontracts-bot@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md docs/SafeContracts_Full_Plan_v1.2.docx
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore(plan): sync SafeContracts task status and DOCX"
          git pull --rebase origin main
          git push origin HEAD:main
