name: Worker2 Validate And Capture

on:
  pull_request:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply Worker 2 analyzer corrections
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path('lib/features/contracts/contracts_screen.dart'),
              Path('lib/features/customers/customers_screen.dart'),
              Path('lib/features/suppliers/suppliers_screen.dart'),
          ]
          for path in paths:
              text = path.read_text()
              text = re.sub(r'\s*matchTextDirection:\s*true,?', '', text)
              path.write_text(text)

          customer = Path('lib/features/customers/customers_screen.dart')
          text = customer.read_text()
          text = text.replace(
              'action: () => unawaited(controller.loadPage(1)),',
              'action: () => controller.loadPage(1),',
          )
          text = text.replace(
              'action: () => unawaited(controller.openCustomer(id)),',
              'action: () => controller.openCustomer(id),',
          )
          customer.write_text(text)
          PY
      - name: Format Worker 2 sources
        run: |
          dart format \
            lib/features/contracts/contract_edit_screen.dart \
            lib/features/contracts/contracts.dart \
            lib/features/contracts/contracts_screen.dart \
            lib/features/contracts/counterparty_business_snapshot.dart \
            lib/features/contracts/premium_contract_details_screen.dart \
            lib/features/customers/customers.dart \
            lib/features/customers/customers_screen.dart \
            lib/features/suppliers/suppliers_screen.dart
      - name: Persist corrected sources on worker branch
        working-directory: .
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile/lib/features/contracts/contract_edit_screen.dart \
            mobile/lib/features/contracts/contracts.dart \
            mobile/lib/features/contracts/contracts_screen.dart \
            mobile/lib/features/contracts/counterparty_business_snapshot.dart \
            mobile/lib/features/contracts/premium_contract_details_screen.dart \
            mobile/lib/features/customers/customers.dart \
            mobile/lib/features/customers/customers_screen.dart \
            mobile/lib/features/suppliers/suppliers_screen.dart
          if git diff --cached --quiet; then
            echo "Worker 2 sources already corrected."
          else
            git commit -m "style(mobile): apply worker2 analyzer and formatter corrections"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Upload corrected formatter output
        uses: actions/upload-artifact@v4
        with:
          name: worker2-corrected-sources
          path: |
            mobile/lib/features/contracts/contract_edit_screen.dart
            mobile/lib/features/contracts/contracts.dart
            mobile/lib/features/contracts/contracts_screen.dart
            mobile/lib/features/contracts/counterparty_business_snapshot.dart
            mobile/lib/features/contracts/premium_contract_details_screen.dart
            mobile/lib/features/customers/customers.dart
            mobile/lib/features/customers/customers_screen.dart
            mobile/lib/features/suppliers/suppliers_screen.dart
          if-no-files-found: error
          retention-days: 1
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
