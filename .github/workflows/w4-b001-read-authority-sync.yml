name: W4 B001 Read Authority Sync

on:
  push:
    branches:
      - bugfix/alkenzy-register-w4-payments-typography

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bugfix/alkenzy-register-w4-payments-typography
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Synchronize REST regressions with authoritative read status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/php/rest_api_001_010.php'): (
                  "sc_p8_assert(str_contains($paymentSql, \"p.status = 'overdue'\") && str_contains($paymentSql, \"p.due_date >= '2026-08-01'\") && str_contains($paymentSql, 'c.accountant_user_id = 42'), 'SC-P8-008 status/date/accountant filters are server-side');",
                  "sc_p8_assert(($paymentRow['status'] ?? '') === 'overdue', 'SC-P8-008 payment status is server-authoritative after due-date and balance evaluation');\nsc_p8_assert(! str_contains($paymentSql, \"p.status = 'overdue'\") && str_contains($paymentSql, \"p.due_date >= '2026-08-01'\") && str_contains($paymentSql, 'c.accountant_user_id = 42'), 'SC-P8-008 due-date/accountant filters remain server-side without trusting stale stored payment status');",
              ),
              Path('tests/php/rest_api_validation_019_028.php'): (
                  "sc_p8v_final_assert(str_contains($paymentSql, \"p.status = 'overdue'\") && str_contains($paymentSql, \"p.due_date >= '2026-08-01'\") && str_contains($paymentSql, 'c.accountant_user_id = 42'), 'SC-P8-025 payment status/date/accountant filters are server-side');",
                  "sc_p8v_final_assert(($payment['status'] ?? '') === 'overdue', 'SC-P8-025 payment status is recomputed by the server from authoritative due date and balances');\nsc_p8v_final_assert(! str_contains($paymentSql, \"p.status = 'overdue'\") && str_contains($paymentSql, \"p.due_date >= '2026-08-01'\") && str_contains($paymentSql, 'c.accountant_user_id = 42'), 'SC-P8-025 payment due-date/accountant filters remain server-side without stale status authority');",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: target count={text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate full backend foundation
        run: bash scripts/test-php.sh
      - name: Validate mobile formatting and tests
        working-directory: mobile
        shell: bash
        run: |
          flutter pub get
          dart format lib test
          git diff --exit-code -- lib test
          flutter analyze
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
      - name: Commit validated B001 regression sync
        shell: bash
        run: |
          rm -f .github/workflows/w4-b001-read-authority-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/php/rest_api_001_010.php tests/php/rest_api_validation_019_028.php .github/workflows/w4-b001-read-authority-sync.yml
          git diff --cached --check
          git commit -m "test(w4): assert server-authoritative payment read status"
          git push origin HEAD:bugfix/alkenzy-register-w4-payments-typography
