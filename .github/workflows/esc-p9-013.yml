name: ESC P9-013 Contract Collection Receipts

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-collection-receipts:
    name: contract-collection-receipts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production

      - name: Validate P9-013 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Database/Migrations/Migration0057EnterpriseContractFinancialCollectionReceiptRevisions.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialCollectionReceiptPolicy.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialCollectionReceiptRevisionRepository.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialCollectionReceiptRevisionService.php
          php -l tests/php/enterprise_contract_financial_collection_receipts_p9_013.php
          php -l tests/php/enterprise_contract_financial_payment_schedule_p9_012.php

      - name: Validate P9-012 compatibility
        run: php tests/php/enterprise_contract_financial_payment_schedule_p9_012.php

      - name: Validate P9-013 collection receipts
        run: php tests/php/enterprise_contract_financial_collection_receipts_p9_013.php
