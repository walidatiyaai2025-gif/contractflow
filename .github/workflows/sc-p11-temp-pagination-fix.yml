name: SC P11 Temporary Pagination Fix

on:
  push:
    branches:
      - agent/sc-p11-004-mobile-suppliers-finance

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sc-p11-004-mobile-suppliers-finance
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply bounded quick-add pagination patch
        run: python scripts/sc_p11_quick_add_pagination_fix.py
      - name: Resolve and format
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test SC-P11 quick-add regressions
        working-directory: mobile
        run: |
          flutter test test/mobile_quick_add_profile_ux_test.dart
          flutter test test/sc_p11_004_payment_pagination_test.dart
          flutter test test/sc_p11_004_suppliers_finance_test.dart
      - name: Commit verified pagination
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/features/records/mobile_quick_add_flow.dart mobile/test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: paginate SC-P11 payment contract references'
          git push origin HEAD:agent/sc-p11-004-mobile-suppliers-finance
