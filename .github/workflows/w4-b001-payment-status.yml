name: W4 B001 Payment Status Closure

on:
  pull_request:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bugfix/alkenzy-register-w4-payments-typography
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply B001 authoritative status patch
        run: python3 scripts/w4_b001_payment_status.py
      - name: Separate read authority from mutation lifecycle state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('wordpress-plugin/safecontracts/src/Payments/PaymentRepository.php')
          text = repo.read_text()
          computed = """            'status' => PaymentStatus::authoritative(
                $row['due_date'] ?? '',
                $row['paid_amount'] ?? '0.0000',
                $row['remaining_amount'] ?? '0.0000'
            ),
"""
          stored = "            'status' => (string) ($row['status'] ?? PaymentStatus::UPCOMING),\n"
          if text.count(computed) != 1:
              raise SystemExit('B001 mutation-state restore target not unique')
          repo.write_text(text.replace(computed, stored, 1))

          controller = Path('wordpress-plugin/safecontracts/src/Rest/DataController.php')
          text = controller.read_text()
          import_old = "use SafeContracts\\Payments\\PaymentRepository;\n"
          import_new = import_old + "use SafeContracts\\Payments\\PaymentStatus;\n"
          if text.count(import_old) != 1:
              raise SystemExit('B001 DataController import target not unique')
          text = text.replace(import_old, import_new, 1)
          old = """            ApiScope::assertAccountant($row['accountant_user_id']);
            return ApiResponse::ok(self::paymentView($row));
"""
          new = """            ApiScope::assertAccountant($row['accountant_user_id']);
            $row['status'] = PaymentStatus::authoritative(
                $row['due_date'] ?? '',
                $row['paid_amount'] ?? '0.0000',
                $row['remaining_amount'] ?? '0.0000'
            );
            return ApiResponse::ok(self::paymentView($row));
"""
          if text.count(old) != 1:
              raise SystemExit('B001 detail read-projection target not unique')
          controller.write_text(text.replace(old, new, 1))
          PY
      - name: Preserve compact server-authority copy contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mobile/lib/features/payments/payments_screen.dart')
          text = path.read_text()
          old = 'Server values are shown as received; mobile does not recalculate them.'
          new = 'Dates, balances and status are server-authoritative. Mobile does not recalculate them.'
          if text.count(old) != 1:
              raise SystemExit('server-authority copy target not unique')
          path.write_text(text.replace(old, new, 1))
          test = Path('mobile/test/alkenzy_w4_density_bug_closure_test.dart')
          test_text = test.read_text().replace(old, new)
          test.write_text(test_text)
          PY
      - name: Validate full PHP foundation
        run: bash scripts/test-php.sh
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Canonically format Flutter
        working-directory: mobile
        run: dart format lib test
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Run normative Flutter regression suite
        working-directory: mobile
        shell: bash
        run: |
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
      - name: Commit verified B001 patch
        shell: bash
        run: |
          rm -f .github/workflows/w4-b001-payment-status.yml
          rm -f scripts/w4_b001_payment_status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(w4): make payment status server-authoritative"
          git push origin HEAD:bugfix/alkenzy-register-w4-payments-typography
