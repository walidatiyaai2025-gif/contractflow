          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_region(path, start, end, new):
              p = Path(path)
              text = p.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{path}: missing start marker {start!r}')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'{path}: missing end marker {end!r}')
              p.write_text(text[:a] + new + text[b:])

