name: W4 Payment Detail Density Closure

on:
  push:
    branches:
      - bugfix/alkenzy-register-w4-payments-typography

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bugfix/alkenzy-register-w4-payments-typography
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply W4 closure patch
        run: python3 scripts/w4_typography_density_closure.py
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Canonically format Flutter
        working-directory: mobile
        run: dart format lib test
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Run all normative Flutter tests
        working-directory: mobile
        shell: bash
        run: |
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
      - name: Commit verified W4 patch
        shell: bash
        run: |
          rm -f .github/workflows/w4-density-closure.yml
          rm -f scripts/w4_typography_density_closure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(w4): compact payment detail typography and loading"
          git push origin HEAD:bugfix/alkenzy-register-w4-payments-typography
