          'original_amount': '1250.0000',
          'paid_amount': '800.0000',
          'remaining_amount': '450.0000',
          'status': 'overdue',
          'contract_is_archived': false,
        },
        'meta': <String, Object?>{'api_version': 'v1'},
      }),
    );
  }
  return ApiTransportResponse(
    statusCode: 404,
    headers: const <String, String>{'content-type': 'application/json'},
    body: jsonEncode(<String, Object?>{'code': 'not_found', 'message': 'Not found.'}),
  );
}
''')
