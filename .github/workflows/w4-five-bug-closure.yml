          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"

      - name: Capture W4 acceptance screenshots
        working-directory: mobile
        run: flutter test test/w4_payment_detail_capture.dart

      - uses: actions/upload-artifact@v4
        with:
          name: w4-b001-b004-b056-b057-b058-evidence
          path: mobile/build/w4-five-bug-evidence/*.png
          if-no-files-found: error

      - name: Commit validated W4 slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress-plugin/safecontracts/src/Payments/PaymentStatus.php \
                  wordpress-plugin/safecontracts/src/Payments/PaymentService.php \
                  wordpress-plugin/safecontracts/src/Rest/DataController.php \
                  mobile/lib/features/ui/safecontracts_design.dart \
                  mobile/lib/features/payments/payments_screen.dart \
                  tests/php/alkenzy_w4_payment_status_closure.php \
                  scripts/test-php.sh \
                  mobile/test/alkenzy_worker4_payment_detail_closure_test.dart \
                  mobile/test/w4_payment_detail_capture.dart
          if git diff --cached --quiet; then
            echo "No W4 patch changes to commit."
            exit 0
          fi
          git commit -m "fix(mobile): close W4 payment status and detail slice"
          git push origin HEAD:bugfix/alkenzy-register-w4-payments-typography
