          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # B001: one server-authoritative payment status engine for mobile list/detail/service.
          status = 'wordpress-plugin/safecontracts/src/Payments/PaymentStatus.php'
          replace_once(
              status,
              "use InvalidArgumentException;\n",
              "use InvalidArgumentException;\nuse SafeContracts\\Contracts\\ContractMoney;\n",
          )
          replace_once(
              status,
              """    public static function isDueSoon(mixed $dueDate, ?DateTimeImmutable $today = null, int $dueSoonDays = 10): bool
    {
        return self::temporalForDueDate($dueDate, $today, $dueSoonDays) === self::DUE_SOON;
    }
""",
              """    public static function authoritative(
        mixed $dueDate,
        mixed $originalAmount,
        mixed $paidAmount,
        mixed $remainingAmount,
        ?DateTimeImmutable $today = null,
        int $dueSoonDays = 10
    ): string {
        $original = ContractMoney::normalizeNonNegative($originalAmount);
        $paid = ContractMoney::normalizeNonNegative($paidAmount);
        $remaining = ContractMoney::normalizeNonNegative($remainingAmount);

        if (
            ContractMoney::compare($remaining, '0.0000') === 0
            || ContractMoney::compare($paid, $original) >= 0
        ) {
            return self::PAID;
        }
        if (ContractMoney::compare($paid, '0.0000') > 0) {
            return self::PARTIALLY_PAID;
        }

        return self::temporalForDueDate($dueDate, $today, $dueSoonDays);
    }

    public static function isDueSoon(mixed $dueDate, ?DateTimeImmutable $today = null, int $dueSoonDays = 10): bool
    {
        return self::temporalForDueDate($dueDate, $today, $dueSoonDays) === self::DUE_SOON;
    }
""",
          )

          service = 'wordpress-plugin/safecontracts/src/Payments/PaymentService.php'
          replace_once(
              service,
              """        $current = PaymentStatus::normalize($payment['status']);
        if ($current === PaymentStatus::PAID || $current === PaymentStatus::PARTIALLY_PAID) {
            return $current;
        }
        return PaymentStatus::temporalForDueDate($payment['due_date'], $today, $dueSoonDays);
""",
              """        return PaymentStatus::authoritative(
            $payment['due_date'],
