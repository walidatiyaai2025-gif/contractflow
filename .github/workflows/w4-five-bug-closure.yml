const _captureKey = Key('w4PaymentCapture');

void main() {
  setUpAll(() => GoogleFonts.config.allowRuntimeFetching = false);
  tearDownAll(() => GoogleFonts.config.allowRuntimeFetching = true);

  for (final languageCode in const <String>['ar', 'en']) {
    testWidgets('capture payment detail $languageCode', (tester) async {
      addTearDown(() => tester.binding.setSurfaceSize(null));
      await tester.binding.setSurfaceSize(const Size(390, 844));
      await tester.pumpWidget(RepaintBoundary(key: _captureKey, child: _app(languageCode)));
      await tester.pumpAndSettle();
      expect(find.byType(AppBar), findsOneWidget);
      await _capture(tester, 'payment_detail_${languageCode}_390');
      await tester.pumpWidget(const SizedBox.shrink());
      await tester.pump();
    });
  }
}

Widget _app(String languageCode) {
  final environment = AppEnvironment.fromValues(
    name: 'local',
    apiBaseUrl: 'https://example.test/wp-json/safecontracts/v1/',
  );
  final client = SafeContractsApiClient(
    environment: environment,
    transport: FakeApiTransport(_handler),
