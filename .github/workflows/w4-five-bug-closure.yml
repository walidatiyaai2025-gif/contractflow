        $view = self::pick($row, ['id','contract_id','contract_number','customer_id','customer_name','supplier_id','supplier_name','counterparty_type','counterparty_id','counterparty_name','accountant_user_id','financial_direction','currency_code','sequence_no','reference','due_date','expected_payment_date','original_amount','paid_amount','remaining_amount','status','contract_is_archived']);
