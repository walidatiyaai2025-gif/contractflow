declare(strict_types=1);

require_once __DIR__ . '/../../wordpress-plugin/safecontracts/src/Contracts/ContractMoney.php';
require_once __DIR__ . '/../../wordpress-plugin/safecontracts/src/Payments/PaymentStatus.php';

use DateTimeImmutable;
use DateTimeZone;
use SafeContracts\Payments\PaymentStatus;

$assertions = 0;
$assertSame = static function (string $expected, string $actual, string $message) use (&$assertions): void {
    ++$assertions;
    if ($expected !== $actual) {
        fwrite(STDERR, "FAIL: {$message}; expected {$expected}, got {$actual}\n");
        exit(1);
    }
};

$today = new DateTimeImmutable('2026-08-24', new DateTimeZone('UTC'));
$assertSame(PaymentStatus::OVERDUE, PaymentStatus::authoritative('2026-08-01', '100.0000', '0.0000', '100.0000', $today), 'past due unpaid payment must be overdue');
$assertSame(PaymentStatus::DUE, PaymentStatus::authoritative('2026-08-24', '100.0000', '0.0000', '100.0000', $today), 'today payment must be due');
$assertSame(PaymentStatus::DUE_SOON, PaymentStatus::authoritative('2026-08-30', '100.0000', '0.0000', '100.0000', $today), 'near-future payment must be due soon');
$assertSame(PaymentStatus::UPCOMING, PaymentStatus::authoritative('2026-09-20', '100.0000', '0.0000', '100.0000', $today), 'future payment outside due-soon window must be upcoming');
$assertSame(PaymentStatus::PAID, PaymentStatus::authoritative('2026-08-01', '100.0000', '100.0000', '0.0000', $today), 'settled payment must stay paid regardless of due date');
$assertSame(PaymentStatus::PARTIALLY_PAID, PaymentStatus::authoritative('2026-08-01', '100.0000', '25.0000', '75.0000', $today), 'partial settlement must preserve partial state');

$dataController = file_get_contents(__DIR__ . '/../../wordpress-plugin/safecontracts/src/Rest/DataController.php');
$paymentService = file_get_contents(__DIR__ . '/../../wordpress-plugin/safecontracts/src/Payments/PaymentService.php');
if ($dataController === false || $paymentService === false) {
    fwrite(STDERR, "FAIL: unable to inspect payment status integration sources\n");
    exit(1);
}
foreach ([
    "PaymentStatus::authoritative(" => 'REST mobile payment projection must use authoritative engine',
    "canonicalStatusFilter" => 'payment status filter must use canonical status after projection',
] as $needle => $message) {
    ++$assertions;
    if (! str_contains($dataController, $needle)) {
        fwrite(STDERR, "FAIL: {$message}\n");
        exit(1);
    }
}
++$assertions;
if (! str_contains($paymentService, 'return PaymentStatus::authoritative(')) {
    fwrite(STDERR, "FAIL: PaymentService must use the same authoritative status engine\n");
    exit(1);
}

echo "ALKENZY W4 B001 authoritative payment status closure passed ({$assertions} assertions).\n";
''')

