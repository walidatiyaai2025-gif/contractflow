name: ESC P7-003 Full Backend Gate

on:
  push:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-decisions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production
      - name: Wire P7-003 regression into checkout gate
        run: printf '\nphp "$ROOT/tests/php/enterprise_workflow_approval_decisions_p7_003.php"\n' >> scripts/test-php.sh
      - name: Run full backend gate with P7-003
        run: ./scripts/test-php.sh
