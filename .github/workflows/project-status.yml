name: SafeContracts Project Status

on:
  workflow_dispatch:
  issues:
    types: [opened, closed, reopened, assigned, unassigned, edited, labeled, unlabeled]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  issues: read

concurrency:
  group: safecontracts-project-status
  cancel-in-progress: true

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate live project status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_project_status.py

      - name: Commit status if changed
        run: |
          git config user.name "safecontracts-bot"
          git config user.email "safecontracts-bot@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md
          if git diff --cached --quiet; then
            echo "Project status already current"
            exit 0
          fi
          git commit -m "chore(status): refresh SafeContracts task table"
          git pull --rebase origin main
          git push origin HEAD:main
