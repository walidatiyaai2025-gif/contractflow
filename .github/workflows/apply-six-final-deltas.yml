name: Apply Six Final Mobile Deltas

on:
  push:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-reference-redesign
          fetch-depth: 0
      - name: Apply exactly six confirmed deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell = Path('mobile/lib/features/navigation/app_shell.dart')
          text = shell.read_text()

          old = 'backgroundColor: SafeContractsVisual.surface,\n        selectedIndex:'
          new = 'backgroundColor: SafeContractsVisual.navyDeep,\n        selectedIndex:'
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('navy drawer delta not applied')

          old = 'floatingActionButtonLocation: FloatingActionButtonLocation.endFloat,'
          new = 'floatingActionButtonLocation: FloatingActionButtonLocation.centerDocked,'
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('centered Quick Add delta not applied')

          old = '''        case MobileDestination.payments:\n        case MobileDestination.followUps:\n          if (mounted) {\n            setState(() => _liveRefreshRevision++);\n          }\n          break;'''
          new = '''        case MobileDestination.payments:\n        case MobileDestination.collections:\n        case MobileDestination.followUps:\n          if (mounted) {\n            setState(() => _liveRefreshRevision++);\n          }\n          break;'''
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('collections refresh reconciliation not applied')

          payments_case = '''      MobileDestination.payments => PaymentsScreen(\n          repository: PaymentsRepository(apiClient),\n          pageSize: widget.config.defaultPageSize,\n          filters: widget.dashboardController.filters,\n          currency: widget.config.currency,\n          canManagePayments:\n              widget.session.can('safecontracts_manage_payments'),\n          canEnterCollection: widget.policy.canEnterCollection,\n          refreshRevision: _liveRefreshRevision,\n        ),'''
          collections_case = '''      MobileDestination.collections => PaymentsScreen(\n          repository: PaymentsRepository(apiClient),\n          pageSize: widget.config.defaultPageSize,\n          filters: widget.dashboardController.filters,\n          currency: widget.config.currency,\n          canManagePayments:\n              widget.session.can('safecontracts_manage_payments'),\n          canEnterCollection: widget.policy.canEnterCollection,\n          refreshRevision: _liveRefreshRevision,\n        ),'''
          if collections_case not in text:
              if payments_case not in text:
                  raise SystemExit('payments body anchor missing')
              text = text.replace(payments_case, payments_case + '\n' + collections_case, 1)
          if collections_case not in text:
              raise SystemExit('collections authoritative-flow reconciliation not applied')
          shell.write_text(text)

          l10n = Path('mobile/lib/core/localization/safecontracts_localizations.dart')
          text = l10n.read_text()
          old = "  return '$sign$whole.${cents.toString().padLeft(2, '0')}';"
          new = "  if (cents == 0) return '$sign$whole';\n  return '$sign$whole.${cents.toString().padLeft(2, '0')}';"
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('whole-number money delta not applied')

          anchor = "  'Customers': 'العملاء',\n"
          additions = (
              "  'Suppliers': 'الموردون',\n"
              "  'Finance': 'المالية',\n"
              "  'Dashboard Two': 'لوحة تحكم اتنين',\n"
          )
          missing = ''.join(line for line in additions.splitlines(True) if line not in text)
          if missing:
              if anchor not in text:
                  raise SystemExit('Arabic navigation translation anchor missing')
              text = text.replace(anchor, anchor + missing, 1)
          for line in additions.splitlines(True):
              if line not in text:
                  raise SystemExit('Arabic navigation labels delta not applied')
          l10n.write_text(text)

          capture = Path('mobile/test/reference_visual_capture_extended_test.dart')
          text = capture.read_text()
          old = '''        'id': 8,\n        'name': 'شركة الخليج للتوريدات',\n        'internal_code': 'S-008',\n        'contact_name': 'سالم حسن',\n        'email': 'supplier@example.com',\n        'phone': '+96550000008',\n        'is_active': true,\n'''
          new = '''        'id': 8,\n        'internal_code': 'S-008',\n        'legal_name': 'شركة الخليج للتوريدات',\n        'trading_name': 'الخليج للتوريدات',\n        'contact_name': 'سالم حسن',\n        'email': 'supplier@example.com',\n        'phone': '+96550000008',\n        'default_currency': 'KWD',\n        'status': 'active',\n        'is_archived': false,\n'''
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('supplier capture fixture delta not applied')
          capture.write_text(text)
          PY
      - name: Commit bounded source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/lib/features/navigation/app_shell.dart \
            mobile/lib/core/localization/safecontracts_localizations.dart \
            mobile/test/reference_visual_capture_extended_test.dart
          if git diff --cached --quiet; then
            echo 'No bounded source changes remain.'
            exit 0
          fi
          git commit -m 'fix(mobile): close six confirmed reference deltas'
          git push origin HEAD:feat/alkenzy-mobile-reference-redesign
