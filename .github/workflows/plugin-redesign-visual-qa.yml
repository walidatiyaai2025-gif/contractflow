name: Plugin Redesign Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'wordpress-plugin/safecontracts/**'
      - 'assets/design/plugin-redesign/reference/**'
      - 'docs/plugin-redesign/**'
      - 'tests/plugin-redesign-visual-qa/**'
      - 'scripts/validate-plugin-design-references.py'
      - '.github/workflows/plugin-redesign-visual-qa.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Screen ownership slice to capture'
        required: true
        default: 'all'
        type: choice
        options: [all, lead, worker1, worker2, worker3]

permissions:
  contents: read

concurrency:
  group: plugin-redesign-visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-wordpress-visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope != 'all' && format('["{0}"]', inputs.scope) || '["lead","worker1","worker2","worker3"]') }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: visualqa-root
          MYSQL_DATABASE: visualqa_wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvisualqa-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      WP_DIR: /tmp/alkenzy-visual-wp
      SC_QA_BASE_URL: http://127.0.0.1:8889
      SC_QA_USER: visual-admin
      SC_QA_PASSWORD: VisualQa-Only-2026!
      SC_QA_OUTPUT: visual-qa-artifacts
      SC_QA_OVERLAY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate locked design references
        run: python3 scripts/validate-plugin-design-references.py

      - name: Resolve visual QA scope, source and widths
        id: qa
        shell: bash
        run: |
          scope='${{ matrix.scope }}'

          source_sha="$SC_QA_OVERLAY_SHA"
          marker='tests/plugin-redesign-visual-qa/SOURCE_HEAD_SHA'
          if [ -f "$marker" ]; then
            source_sha="$(tr -d '\r\n[:space:]' < "$marker")"
            if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid QA production-source marker: $source_sha" >&2
              exit 1
            fi
          fi

          widths='390,600,768,782,1024,1280,1366,1440,1920'
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "arabic_widths=$widths" >> "$GITHUB_OUTPUT"
          echo "Resolved scope=$scope Arabic widths=$widths production source=$source_sha overlay head=$SC_QA_OVERLAY_SHA workflow SHA=$GITHUB_SHA"

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          tools: wp-cli
          ini-file: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install real WordPress
        shell: bash
        run: |
          rm -rf "$WP_DIR"
          mkdir -p "$WP_DIR"
          wp core download --path="$WP_DIR" --locale=en_US --force
          wp config create \
            --path="$WP_DIR" \
            --dbname=visualqa_wordpress \
            --dbuser=root \
            --dbpass=visualqa-root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp core install \
            --path="$WP_DIR" \
            --url="$SC_QA_BASE_URL" \
            --title='ALKENZY ADV Visual QA' \
            --admin_user="$SC_QA_USER" \
            --admin_password="$SC_QA_PASSWORD" \
            --admin_email=visual-admin@example.test \
            --skip-email
          rm -rf "$WP_DIR/wp-content/plugins/safecontracts"
          ln -s "$GITHUB_WORKSPACE/wordpress-plugin/safecontracts" "$WP_DIR/wp-content/plugins/safecontracts"
          set -o pipefail
          wp plugin activate safecontracts --path="$WP_DIR" 2>&1 | tee /tmp/safecontracts-activation.log
          if grep -Fq 'WordPress database error' /tmp/safecontracts-activation.log; then
            echo 'SafeContracts activation emitted a WordPress database error; real-runtime acceptance cannot continue.' >&2
            exit 1
          fi

      - name: Enable conditional recovery route in test runtime only
        shell: bash
        run: |
          mkdir -p "$WP_DIR/wp-content/mu-plugins"
          cat > "$WP_DIR/wp-content/mu-plugins/safecontracts-visual-qa.php" <<'PHP'
          <?php
          /** Test-only visual QA bootstrap. Never shipped in the plugin package. */
          add_action('plugins_loaded', static function (): void {
              if (class_exists('SafeContracts\\Admin\\MigrationRecoveryPage')) {
                  SafeContracts\Admin\MigrationRecoveryPage::register();
              }
          }, 99);
          PHP

      - name: Verify historical import-errors schema repair
        run: wp eval-file "$GITHUB_WORKSPACE/tests/plugin-redesign-visual-qa/schema-repair-runtime.php" --path="$WP_DIR"

      - name: Seed controlled real-domain fixtures
        run: wp eval-file "$GITHUB_WORKSPACE/tests/plugin-redesign-visual-qa/seed.php" --path="$WP_DIR"

      - name: Verify repeatable visible demo-data lifecycle
        env:
          SC_QA_SCOPE: ${{ steps.qa.outputs.scope }}
        run: wp eval-file "$GITHUB_WORKSPACE/tests/plugin-redesign-visual-qa/demo-data-runtime.php" --path="$WP_DIR"

      - name: Install Arabic WordPress language pack
        shell: bash
        run: |
          wp language core install ar --path="$WP_DIR"
          wp site switch-language ar --path="$WP_DIR"
          wp user update "$SC_QA_USER" --locale=ar --path="$WP_DIR"

      - name: Start disposable WordPress HTTP runtime
        shell: bash
        run: |
          nohup php -S 127.0.0.1:8889 -t "$WP_DIR" > /tmp/safecontracts-visual-wp.log 2>&1 &
          echo $! > /tmp/safecontracts-visual-wp.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$SC_QA_BASE_URL/wp-login.php" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/safecontracts-visual-wp.log || true
          exit 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture authenticated Arabic RTL evidence
        env:
          SC_QA_SCOPE: ${{ steps.qa.outputs.scope }}
          SC_QA_SOURCE_SHA: ${{ steps.qa.outputs.source_sha }}
          SC_QA_LOCALE: ar
          SC_QA_WIDTHS: ${{ steps.qa.outputs.arabic_widths }}
        run: node tests/plugin-redesign-visual-qa/capture.mjs

      - name: Switch authenticated admin to English LTR
        shell: bash
        run: |
          wp site switch-language en_US --path="$WP_DIR"
          wp user update "$SC_QA_USER" --locale=en_US --path="$WP_DIR"

      - name: Capture authenticated English LTR desktop smoke evidence
        env:
          SC_QA_SCOPE: ${{ steps.qa.outputs.scope }}
          SC_QA_SOURCE_SHA: ${{ steps.qa.outputs.source_sha }}
          SC_QA_LOCALE: en_US
          SC_QA_WIDTHS: '1440'
        run: node tests/plugin-redesign-visual-qa/capture.mjs

      - name: Fail on runtime PHP or database errors
        shell: bash
        run: |
          if grep -Ein 'PHP (Fatal error|Parse error)|Uncaught (Error|Exception)|WordPress database error' /tmp/safecontracts-visual-wp.log; then
            echo 'Runtime PHP/database error detected in the real WordPress visual QA server log.' >&2
            exit 1
          fi

      - name: Preserve runtime diagnostics and provenance
        if: always()
        shell: bash
        run: |
          mkdir -p visual-qa-artifacts/_runtime
          cp /tmp/safecontracts-activation.log visual-qa-artifacts/_runtime/plugin-activation.log 2>/dev/null || true
          cp /tmp/safecontracts-visual-wp.log visual-qa-artifacts/_runtime/php-server.log 2>/dev/null || true
          wp plugin status safecontracts --path="$WP_DIR" > visual-qa-artifacts/_runtime/plugin-status.txt 2>&1 || true
          wp core version --path="$WP_DIR" > visual-qa-artifacts/_runtime/wordpress-version.txt 2>&1 || true
          php -v > visual-qa-artifacts/_runtime/php-version.txt 2>&1 || true
          printf '%s\n' '${{ steps.qa.outputs.source_sha }}' > visual-qa-artifacts/_runtime/source-head-sha.txt
          printf '%s\n' "$SC_QA_OVERLAY_SHA" > visual-qa-artifacts/_runtime/overlay-head-sha.txt
          printf '%s\n' "$GITHUB_SHA" > visual-qa-artifacts/_runtime/workflow-event-sha.txt

      - name: Upload immutable visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-redesign-visual-qa-${{ steps.qa.outputs.scope }}-${{ steps.qa.outputs.source_sha }}
          path: visual-qa-artifacts/
          if-no-files-found: error
          retention-days: 30
