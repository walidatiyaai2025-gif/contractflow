name: ESC P9-007 Contract Financial Variations

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-financial-variations:
    name: contract-financial-variations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production

      - name: Validate P9-007 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Database/Migrations/Migration0051EnterpriseContractFinancialVariationRevisions.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialVariationPolicy.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialVariationRevisionRepository.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialVariationRevisionService.php
          php -l tests/php/enterprise_contract_financial_variations_p9_007.php

      - name: Validate P9-007 financial variations
        run: php tests/php/enterprise_contract_financial_variations_p9_007.php
