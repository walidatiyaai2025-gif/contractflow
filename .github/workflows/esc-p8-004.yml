name: ESC P8-004 Contract Notice Period Rules Gate

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-notice-period-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production
      - name: Validate P8-004 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Database/Migrations/Migration0046EnterpriseContractNoticePeriodRules.php
          php -l wordpress-plugin/safecontracts/src/Notices/ContractNoticePeriodRulePolicy.php
          php -l wordpress-plugin/safecontracts/src/Notices/ContractNoticePeriodRuleRepository.php
          php -l wordpress-plugin/safecontracts/src/Notices/ContractNoticePeriodRuleService.php
          php -l tests/php/enterprise_contract_notice_period_rules_p8_004.php
      - name: Validate ESC-P8-004 Contract Notice Period Rules foundation
        run: php tests/php/enterprise_contract_notice_period_rules_p8_004.php
