name: REF02 Navigation Visual Delta

on:
  push:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-reference-redesign
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply only verified REF02 navigation deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/lib/features/navigation/app_shell.dart')
          text = path.read_text()

          replacements = [
              (
                  '      drawer: NavigationDrawer(\n        backgroundColor: SafeContractsVisual.surface,\n',
                  '      drawer: NavigationDrawer(\n        backgroundColor: SafeContractsVisual.navyDeep,\n        indicatorColor: SafeContractsVisual.roseGoldSoft,\n',
              ),
              (
                  '              icon: Icon(_icon(destination)),\n              selectedIcon: Icon(\n                _icon(destination),\n                color: SafeContractsVisual.navy,\n              ),\n              label: Text(_label(l10n, destination)),\n',
                  '              icon: Icon(\n                _icon(destination),\n                color: Colors.white70,\n              ),\n              selectedIcon: Icon(\n                _icon(destination),\n                color: SafeContractsVisual.roseGold,\n              ),\n              label: Text(\n                _label(l10n, destination),\n                style: const TextStyle(\n                  color: Colors.white,\n                  fontWeight: FontWeight.w700,\n                ),\n              ),\n',
              ),
              (
                  '      floatingActionButtonLocation: FloatingActionButtonLocation.endFloat,\n',
                  '      floatingActionButtonLocation: FloatingActionButtonLocation.centerDocked,\n',
              ),
              (
                  '    const preferred = <MobileDestination>[\n      MobileDestination.dashboard,\n      MobileDestination.customers,\n      MobileDestination.contracts,\n      MobileDestination.payments,\n      MobileDestination.profile,\n    ];\n',
                  '    const preferred = <MobileDestination>[\n      MobileDestination.dashboard,\n      MobileDestination.contracts,\n      MobileDestination.customers,\n      MobileDestination.profile,\n    ];\n',
              ),
              (
                  '        decoration: const BoxDecoration(\n          color: SafeContractsVisual.surface,\n          border: Border(\n            top: BorderSide(color: SafeContractsVisual.outline),\n          ),\n          boxShadow: [\n            BoxShadow(\n              color: Color(0x205E5142),\n',
                  '        decoration: const BoxDecoration(\n          color: SafeContractsVisual.navyDeep,\n          border: Border(\n            top: BorderSide(color: Color(0x33FFFFFF)),\n          ),\n          boxShadow: [\n            BoxShadow(\n              color: Color(0x33000000),\n',
              ),
              (
                  '                      color: isSelected\n                          ? SafeContractsVisual.roseGoldSoft.withValues(\n                              alpha: 0.86,\n                            )\n                          : Colors.transparent,\n',
                  '                      color: isSelected\n                          ? SafeContractsVisual.roseGold.withValues(alpha: 0.18)\n                          : Colors.transparent,\n',
              ),
              (
                  '                            color: isSelected\n                                ? SafeContractsVisual.navy\n                                : SafeContractsVisual.muted,\n',
                  '                            color: isSelected\n                                ? SafeContractsVisual.roseGold\n                                : Colors.white70,\n',
              ),
              (
                  '                                    color: isSelected\n                                        ? SafeContractsVisual.navy\n                                        : SafeContractsVisual.muted,\n',
                  '                                    color: isSelected\n                                        ? SafeContractsVisual.roseGold\n                                        : Colors.white70,\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected navigation snippet missing:\n{old[:180]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cd mobile
          flutter pub get
          dart format lib/features/navigation/app_shell.dart
          flutter analyze
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
          cd ..
          git rm .github/workflows/ref02-navigation-visual-delta.yml
      - name: Persist verified visual delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/features/navigation/app_shell.dart .github/workflows/ref02-navigation-visual-delta.yml
          git commit -m 'fix(mobile): align navigation with locked REF02'
          git push origin HEAD:feat/alkenzy-mobile-reference-redesign
