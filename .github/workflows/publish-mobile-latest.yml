name: Publish Enterprise Safe Contracts Mobile Latest

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production ESC API base URL ending in /wp-json/safecontracts/v1/"
        required: true
        type: string
      device_evidence:
        description: "Reference to real Android device verification evidence"
        required: true
        type: string
      uat_evidence:
        description: "Reference to completed ESC business UAT evidence"
        required: true
        type: string
      coexistence_evidence:
        description: "Reference proving Safe Contract and ESC coexist on one device"
        required: true
        type: string
      firebase_evidence:
        description: "Reference proving the ESC Firebase Android identity"
        required: true
        type: string
      release_notes:
        description: "Optional release note"
        required: false
        default: "Enterprise Safe Contracts Android production update"
        type: string

permissions:
  contents: write

env:
  ESC_APPLICATION_ID: com.safecontracts.enterprise
  SAFE_CONTRACT_APPLICATION_ID: com.safecontracts.safecontracts_mobile

jobs:
  publish-esc-mobile-latest:
    if: github.ref == 'refs/heads/enterprise-safecontracts'
    runs-on: ubuntu-latest
    environment: esc-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enterprise-safecontracts
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require ESC-only production material
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ESC_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ESC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESC_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ESC_ANDROID_CERT_SHA256 }}
          FIREBASE_DEV_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_DEV_BASE64 }}
          FIREBASE_STAGING_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_STAGING_BASE64 }}
          FIREBASE_PRODUCTION_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_PRODUCTION_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256 \
            FIREBASE_DEV_B64 FIREBASE_STAGING_B64 FIREBASE_PRODUCTION_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "FAIL: ESC production secret $name is missing" >&2
              exit 1
            fi
          done

      - name: Validate ESC production inputs
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          DEVICE_EVIDENCE: ${{ inputs.device_evidence }}
          UAT_EVIDENCE: ${{ inputs.uat_evidence }}
          COEXISTENCE_EVIDENCE: ${{ inputs.coexistence_evidence }}
          FIREBASE_EVIDENCE: ${{ inputs.firebase_evidence }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ['API_BASE_URL'].strip()
          parsed = urlparse(url)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('FAIL: ESC production API URL must use HTTPS')
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('FAIL: ESC production API URL must not contain credentials/query/fragment')
          if not parsed.path.rstrip('/').endswith('/wp-json/safecontracts/v1'):
              raise SystemExit('FAIL: ESC production API URL must target /wp-json/safecontracts/v1/')
          for key in ('DEVICE_EVIDENCE', 'UAT_EVIDENCE', 'COEXISTENCE_EVIDENCE', 'FIREBASE_EVIDENCE'):
              if len(os.environ[key].strip()) < 3:
                  raise SystemExit(f'FAIL: {key} reference is required')
          PY

      - name: Materialize isolated ESC signing and Firebase files
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ESC_ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_DEV_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_DEV_BASE64 }}
          FIREBASE_STAGING_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_STAGING_BASE64 }}
          FIREBASE_PRODUCTION_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_PRODUCTION_BASE64 }}
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/esc-signing"
          FIREBASE_DIR="$RUNNER_TEMP/esc-firebase"
          mkdir -p "$SIGNING_DIR" "$FIREBASE_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_DIR/release.jks"
          printf '%s' "$FIREBASE_DEV_B64" | base64 --decode > "$FIREBASE_DIR/dev-google-services.json"
          printf '%s' "$FIREBASE_STAGING_B64" | base64 --decode > "$FIREBASE_DIR/staging-google-services.json"
          printf '%s' "$FIREBASE_PRODUCTION_B64" | base64 --decode > "$FIREBASE_DIR/production-google-services.json"
          test -s "$SIGNING_DIR/release.jks"
          test -s "$FIREBASE_DIR/dev-google-services.json"
          test -s "$FIREBASE_DIR/staging-google-services.json"
          test -s "$FIREBASE_DIR/production-google-services.json"
          {
            echo "ESC_ANDROID_KEYSTORE_PATH=$SIGNING_DIR/release.jks"
            echo "ESC_FIREBASE_ANDROID_CONFIG_DEV=$FIREBASE_DIR/dev-google-services.json"
            echo "ESC_FIREBASE_ANDROID_CONFIG_STAGING=$FIREBASE_DIR/staging-google-services.json"
            echo "ESC_FIREBASE_ANDROID_CONFIG_PRODUCTION=$FIREBASE_DIR/production-google-services.json"
          } >> "$GITHUB_ENV"

      - name: Validate repository Android isolation contract
        run: python3 scripts/verify_esc_android_isolation.py

      - name: Bootstrap isolated ESC Android platform
        shell: bash
        run: ./scripts/bootstrap_android.sh

      - name: Run ESC mobile quality gates
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build production-signed ESC APK
        working-directory: mobile
        shell: bash
        env:
          ESC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ESC_ANDROID_KEYSTORE_PASSWORD }}
          ESC_ANDROID_KEY_ALIAS: ${{ secrets.ESC_ANDROID_KEY_ALIAS }}
          ESC_ANDROID_KEY_PASSWORD: ${{ secrets.ESC_ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          flutter build apk --flavor production --release \
            --dart-define=ESC_ENV=production \
            --dart-define=ESC_API_BASE_URL="$API_BASE_URL"

      - name: Verify ESC package and signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ESC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-production-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/esc-apksigner.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/esc-apksigner.txt" | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "FAIL: ESC production APK signing certificate does not match ESC_ANDROID_CERT_SHA256" >&2
            exit 1
          fi
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='$ESC_APPLICATION_ID'" <<<"$BADGING"
          if grep -Fq "package: name='$SAFE_CONTRACT_APPLICATION_ID'" <<<"$BADGING"; then
            echo "FAIL: ESC APK resolved to the Safe Contract package" >&2
            exit 1
          fi
          python3 scripts/verify_esc_android_isolation.py --esc-apk "$APK" --aapt "$AAPT"

      - name: Prepare verified ESC retention artifact
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          DEVICE_EVIDENCE: ${{ inputs.device_evidence }}
          UAT_EVIDENCE: ${{ inputs.uat_evidence }}
          COEXISTENCE_EVIDENCE: ${{ inputs.coexistence_evidence }}
          FIREBASE_EVIDENCE: ${{ inputs.firebase_evidence }}
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-production-release.apk"
          python3 scripts/enterprise_verified_artifacts.py publish-apk \
            --apk "$APK" \
            --source-sha "$GITHUB_SHA" \
            --quality-run-id "$GITHUB_RUN_ID" \
            --quality-gates-passed \
            --api-base-url "$API_BASE_URL" \
            --signing-verified \
            --identity-verified \
            --firebase-identity-verified \
            --device-evidence "$DEVICE_EVIDENCE" \
            --uat-evidence "$UAT_EVIDENCE" \
            --coexistence-evidence "$COEXISTENCE_EVIDENCE" \
            --firebase-evidence "$FIREBASE_EVIDENCE"
          python3 scripts/enterprise_verified_artifacts.py check --require-apk

      - name: Persist latest verified ESC APK slot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Last verified Enterprise apk"
          if git diff --cached --quiet; then
            echo "Verified ESC APK slot already matches this build"
          else
            git commit -m "ESC-P0-005 retain verified Enterprise Android APK [skip ci]"
            git pull --rebase origin enterprise-safecontracts
            git push origin HEAD:enterprise-safecontracts
          fi

      - name: Publish ESC-only stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          APK="Last verified Enterprise apk/EnterpriseSafeContracts-latest.apk"
          SHA_FILE="$APK.sha256"
          PROVENANCE="Last verified Enterprise apk/VERIFIED.json"
          test -s "$APK"
          test -s "$SHA_FILE"
          test -s "$PROVENANCE"
          gh release delete esc-mobile-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create esc-mobile-latest \
            "$APK" \
            "$SHA_FILE" \
            "$PROVENANCE" \
            --target enterprise-safecontracts \
            --title "Enterprise Safe Contracts Mobile Latest" \
            --notes "$RELEASE_NOTES\n\nSource commit: $GITHUB_SHA\nProduct: Enterprise Safe Contracts"
          gh release view esc-mobile-latest --json url,tagName,assets
