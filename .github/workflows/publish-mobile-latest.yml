name: Publish Alkenzy ADV Mobile Latest

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Alkenzy ADV production SafeContracts API"
        required: true
        default: "https://sys.alkenzy.com/wp-json/safecontracts/v1/"
        type: string
      release_notes:
        description: "Optional release note"
        required: false
        default: "Alkenzy ADV 0.3.2 production update"
        type: string

permissions:
  contents: write

jobs:
  publish-mobile-latest:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Require production signing material
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SC_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SC_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.SC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "FAIL: production signing secret $name is missing" >&2
              exit 1
            fi
          done
      - name: Validate Alkenzy production API URL
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ['API_BASE_URL'].strip()
          parsed = urlparse(url)
          expected = 'https://sys.alkenzy.com/wp-json/safecontracts/v1/'
          if url != expected:
              raise SystemExit(f'FAIL: Alkenzy ADV 0.3.2 must target exactly {expected}')
          if parsed.scheme != 'https' or parsed.hostname != 'sys.alkenzy.com':
              raise SystemExit('FAIL: production API host must be sys.alkenzy.com over HTTPS')
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('FAIL: production API URL must not contain credentials/query/fragment')
          PY
      - name: Verify sys.alkenzy.com before signing
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: python3 scripts/verify_production_health.py "$API_BASE_URL"
      - name: Bootstrap Android and production signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safecontracts-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/safecontracts-signing/release.jks"
          test -s "$RUNNER_TEMP/safecontracts-signing/release.jks"
          ./scripts/bootstrap_android.sh
      - name: Build production-signed Alkenzy ADV 0.3.2 APK
        working-directory: mobile
        shell: bash
        env:
          SC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/safecontracts-signing/release.jks
          SC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SC_ANDROID_KEYSTORE_PASSWORD }}
          SC_ANDROID_KEY_ALIAS: ${{ secrets.SC_ANDROID_KEY_ALIAS }}
          SC_ANDROID_KEY_PASSWORD: ${{ secrets.SC_ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL="$API_BASE_URL"
      - name: Verify signing certificate, package and embedded API host
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.SC_ANDROID_CERT_SHA256 }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "FAIL: production APK signing certificate does not match SC_ANDROID_CERT_SHA256" >&2
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='com.safecontracts.safecontracts_mobile'" <<<"$BADGING"

          LIBAPP="$(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/libapp\.so$' | head -n 1)"
          test -n "$LIBAPP"
          unzip -p "$APK" "$LIBAPP" > "$RUNNER_TEMP/libapp.so"
          strings "$RUNNER_TEMP/libapp.so" > "$RUNNER_TEMP/libapp.strings"
          grep -Fq "sys.alkenzy.com" "$RUNNER_TEMP/libapp.strings"
          if grep -Fq "cms.50sols.com" "$RUNNER_TEMP/libapp.strings"; then
            echo "FAIL: production APK contains retired cms.50sols.com host" >&2
            exit 1
          fi

          cp "$APK" Alkenzy-ADV-0.3.2-sys.alkenzy.com.apk
          sha256sum Alkenzy-ADV-0.3.2-sys.alkenzy.com.apk > Alkenzy-ADV-0.3.2-sys.alkenzy.com.apk.sha256
          printf 'version=0.3.2+6\nsource_commit=%s\napi_base_url=%s\nsigning_cert_sha256=%s\n' "$GITHUB_SHA" "$API_BASE_URL" "$EXPECTED" > MOBILE-RELEASE.txt
      - name: Publish stable Alkenzy ADV mobile-latest GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          gh release delete mobile-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create mobile-latest \
            Alkenzy-ADV-0.3.2-sys.alkenzy.com.apk \
            Alkenzy-ADV-0.3.2-sys.alkenzy.com.apk.sha256 \
            MOBILE-RELEASE.txt \
            --target "$GITHUB_SHA" \
            --title "Alkenzy ADV Mobile 0.3.2" \
            --notes "$RELEASE_NOTES\n\nSource commit: $GITHUB_SHA\nAPI: https://sys.alkenzy.com/wp-json/safecontracts/v1/"
          gh release view mobile-latest --json url,tagName,assets
