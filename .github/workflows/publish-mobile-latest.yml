name: Publish Safe Contracts Mobile Latest

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production Safe Contracts API base URL ending in /wp-json/safecontracts/v1/"
        required: true
        type: string
      release_notes:
        description: "Optional release note"
        required: false
        default: "Safe Contracts Android production update"
        type: string

permissions:
  contents: write

jobs:
  publish-mobile-latest:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Require production signing material
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SC_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SC_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.SC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "FAIL: production signing secret $name is missing" >&2
              exit 1
            fi
          done
      - name: Validate production API URL
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ['API_BASE_URL'].strip()
          parsed = urlparse(url)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('FAIL: production API URL must use HTTPS')
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('FAIL: production API URL must not contain credentials/query/fragment')
          if not parsed.path.rstrip('/').endswith('/wp-json/safecontracts/v1'):
              raise SystemExit('FAIL: production API URL must target /wp-json/safecontracts/v1/')
          PY
      - name: Bootstrap Android and production signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SC_ANDROID_KEYSTORE_BASE64 }}
          SC_REQUIRE_PRODUCTION_ADMOB: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safecontracts-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/safecontracts-signing/release.jks"
          test -s "$RUNNER_TEMP/safecontracts-signing/release.jks"
          ./scripts/bootstrap_android.sh
      - name: Build production-signed APK
        working-directory: mobile
        shell: bash
        env:
          SC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/safecontracts-signing/release.jks
          SC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SC_ANDROID_KEYSTORE_PASSWORD }}
          SC_ANDROID_KEY_ALIAS: ${{ secrets.SC_ANDROID_KEY_ALIAS }}
          SC_ANDROID_KEY_PASSWORD: ${{ secrets.SC_ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL="$API_BASE_URL"
      - name: Verify signing certificate and package
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.SC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "FAIL: production APK signing certificate does not match SC_ANDROID_CERT_SHA256" >&2
            exit 1
          fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='com.safecontracts.safecontracts_mobile'" <<<"$BADGING"
          cp "$APK" SafeContracts-Mobile.apk
          sha256sum SafeContracts-Mobile.apk > SafeContracts-Mobile.apk.sha256
          printf 'source_commit=%s\napi_base_url=%s\nsigning_cert_sha256=%s\nadmob_app_id=ca-app-pub-3218037275900725~7401372044\n' "$GITHUB_SHA" "${{ inputs.api_base_url }}" "$EXPECTED" > MOBILE-RELEASE.txt
      - name: Publish stable mobile-latest GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          gh release delete mobile-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create mobile-latest \
            SafeContracts-Mobile.apk \
            SafeContracts-Mobile.apk.sha256 \
            MOBILE-RELEASE.txt \
            --target "$GITHUB_SHA" \
            --title "Safe Contracts Mobile Latest" \
            --notes "$RELEASE_NOTES\n\nSource commit: $GITHUB_SHA"
          gh release view mobile-latest --json url,tagName,assets
