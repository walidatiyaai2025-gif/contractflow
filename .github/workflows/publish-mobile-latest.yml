name: Publish Enterprise Safe Contracts Mobile Latest

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production ESC API base URL ending in /wp-json/safecontracts/v1/"
        required: true
        type: string
      coexistence_record_base64:
        description: "Base64 JSON from ANDROID_COEXISTENCE_EVIDENCE_TEMPLATE.json for this exact source SHA"
        required: true
        type: string
      device_evidence:
        description: "Reference to real Android device verification evidence"
        required: true
        type: string
      uat_evidence:
        description: "Reference to completed ESC business UAT evidence"
        required: true
        type: string
      coexistence_evidence:
        description: "Reference proving Safe Contract and ESC coexist on one device"
        required: true
        type: string
      firebase_evidence:
        description: "Reference proving the ESC Firebase Android identity"
        required: true
        type: string
      release_notes:
        description: "Optional release note"
        required: false
        default: "Enterprise Safe Contracts Android production update"
        type: string

permissions:
  contents: write

env:
  ESC_APPLICATION_ID: com.safecontracts.enterprise
  SAFE_CONTRACT_APPLICATION_ID: com.safecontracts.safecontracts_mobile

jobs:
  publish-esc-mobile-latest:
    if: github.ref == 'refs/heads/enterprise-safecontracts'
    runs-on: ubuntu-latest
    environment: esc-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require live schema-v2 ESC branch protection
        shell: bash
        env:
          ADMIN_READ_TOKEN: ${{ secrets.ESC_GITHUB_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_READ_TOKEN:-}" ]]; then
            echo "FAIL: ESC_GITHUB_ADMIN_READ_TOKEN is required to verify live #522 enforcement before stable publication" >&2
            exit 1
          fi

          EVIDENCE_DIR="$RUNNER_TEMP/esc-stable-branch-protection"
          mkdir -p "$EVIDENCE_DIR"
          export GH_TOKEN="$ADMIN_READ_TOKEN"

          gh api "repos/${GITHUB_REPOSITORY}/branches/enterprise-safecontracts" > "$EVIDENCE_DIR/branch.json"
          BRANCH_HEAD="$(python3 - "$EVIDENCE_DIR/branch.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          value = str(payload.get('commit', {}).get('sha', '')).strip()
          if not value:
              raise SystemExit('FAIL: captured enterprise-safecontracts branch has no commit SHA')
          print(value)
          PY
          )"
          if [[ "$BRANCH_HEAD" != "$GITHUB_SHA" ]]; then
            echo "FAIL: enterprise-safecontracts advanced after this release dispatch; dispatch a new exact-head release" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/enterprise-safecontracts" > "$EVIDENCE_DIR/rules.json"
          gh api "repos/${GITHUB_REPOSITORY}/branches/enterprise-safecontracts/protection" > "$EVIDENCE_DIR/protection.json"

          AUDIT="$EVIDENCE_DIR/esc-branch-protection-audit.json"
          python3 scripts/audit_esc_branch_protection.py \
            --branch-json "$EVIDENCE_DIR/branch.json" \
            --rules-json "$EVIDENCE_DIR/rules.json" \
            --protection-json "$EVIDENCE_DIR/protection.json" \
            --break-glass-note "No routine bypass. Emergency repository-admin bypass is documented in #522 and requires owner approval." \
            --output "$AUDIT"

          python3 - "$AUDIT" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if payload.get('schema_version') != 2:
              raise SystemExit('FAIL: stable publication requires schema-v2 branch-protection audit evidence')
          if payload.get('branch') != 'enterprise-safecontracts':
              raise SystemExit('FAIL: branch-protection audit targets the wrong branch')
          if payload.get('decision') != 'PASS':
              raise SystemExit('FAIL: stable publication requires live #522 decision=PASS')
          checks = payload.get('checks')
          if not isinstance(checks, dict) or not checks or not all(value is True for value in checks.values()):
              raise SystemExit('FAIL: stable publication requires every schema-v2 branch-protection control to pass')
          required = {
              'protected_branch',
              'pull_request_required',
              'required_status_checks_present',
              'strict_up_to_date_status_checks',
              'administrator_enforcement_verified',
              'conversation_resolution_required',
              'force_push_blocked',
              'branch_deletion_blocked',
              'break_glass_documented',
          }
          missing = sorted(required - set(checks))
          if missing:
              raise SystemExit('FAIL: schema-v2 audit is missing required controls: ' + ', '.join(missing))
          PY

          AUDIT_SHA256="$(sha256sum "$AUDIT" | awk '{print $1}')"
          echo "ESC_BRANCH_PROTECTION_AUDIT=$AUDIT" >> "$GITHUB_ENV"
          echo "ESC_BRANCH_PROTECTION_AUDIT_SHA256=$AUDIT_SHA256" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require ESC-only production material
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ESC_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ESC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ESC_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ESC_ANDROID_CERT_SHA256 }}
          FIREBASE_DEV_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_DEV_BASE64 }}
          FIREBASE_STAGING_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_STAGING_BASE64 }}
          FIREBASE_PRODUCTION_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_PRODUCTION_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256 \
            FIREBASE_DEV_B64 FIREBASE_STAGING_B64 FIREBASE_PRODUCTION_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "FAIL: ESC production secret $name is missing" >&2
              exit 1
            fi
          done

      - name: Validate ESC production inputs
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          DEVICE_EVIDENCE: ${{ inputs.device_evidence }}
          UAT_EVIDENCE: ${{ inputs.uat_evidence }}
          COEXISTENCE_EVIDENCE: ${{ inputs.coexistence_evidence }}
          FIREBASE_EVIDENCE: ${{ inputs.firebase_evidence }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ['API_BASE_URL'].strip()
          parsed = urlparse(url)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('FAIL: ESC production API URL must use HTTPS')
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('FAIL: ESC production API URL must not contain credentials/query/fragment')
          if not parsed.path.rstrip('/').endswith('/wp-json/safecontracts/v1'):
              raise SystemExit('FAIL: ESC production API URL must target /wp-json/safecontracts/v1/')
          for key in ('DEVICE_EVIDENCE', 'UAT_EVIDENCE', 'COEXISTENCE_EVIDENCE', 'FIREBASE_EVIDENCE'):
              if len(os.environ[key].strip()) < 3:
                  raise SystemExit(f'FAIL: {key} reference is required')
          PY

      - name: Validate exact-source Android coexistence PASS record
        shell: bash
        env:
          UAT_RECORD_B64: ${{ inputs.coexistence_record_base64 }}
          DEVICE_EVIDENCE: ${{ inputs.device_evidence }}
          UAT_EVIDENCE: ${{ inputs.uat_evidence }}
          COEXISTENCE_EVIDENCE: ${{ inputs.coexistence_evidence }}
          FIREBASE_EVIDENCE: ${{ inputs.firebase_evidence }}
        run: |
          set -euo pipefail
          if [[ -z "${UAT_RECORD_B64:-}" ]]; then
            echo "FAIL: coexistence_record_base64 is required" >&2
            exit 1
          fi
          UAT_RECORD="$RUNNER_TEMP/esc-android-coexistence-evidence.json"
          if ! printf '%s' "$UAT_RECORD_B64" | base64 --decode > "$UAT_RECORD"; then
            echo "FAIL: coexistence_record_base64 is not valid Base64" >&2
            exit 1
          fi
          test -s "$UAT_RECORD"
          python3 scripts/validate_esc_android_coexistence_evidence.py \
            --record "$UAT_RECORD" \
            --source-sha "$GITHUB_SHA" \
            --device-evidence "$DEVICE_EVIDENCE" \
            --uat-evidence "$UAT_EVIDENCE" \
            --coexistence-evidence "$COEXISTENCE_EVIDENCE" \
            --firebase-evidence "$FIREBASE_EVIDENCE"
          echo "ESC_UAT_RECORD=$UAT_RECORD" >> "$GITHUB_ENV"

      - name: Materialize isolated ESC signing and Firebase files
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ESC_ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_DEV_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_DEV_BASE64 }}
          FIREBASE_STAGING_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_STAGING_BASE64 }}
          FIREBASE_PRODUCTION_B64: ${{ secrets.ESC_FIREBASE_ANDROID_CONFIG_PRODUCTION_BASE64 }}
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/esc-signing"
          FIREBASE_DIR="$RUNNER_TEMP/esc-firebase"
          mkdir -p "$SIGNING_DIR" "$FIREBASE_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_DIR/release.jks"
          printf '%s' "$FIREBASE_DEV_B64" | base64 --decode > "$FIREBASE_DIR/dev-google-services.json"
          printf '%s' "$FIREBASE_STAGING_B64" | base64 --decode > "$FIREBASE_DIR/staging-google-services.json"
          printf '%s' "$FIREBASE_PRODUCTION_B64" | base64 --decode > "$FIREBASE_DIR/production-google-services.json"
          test -s "$SIGNING_DIR/release.jks"
          test -s "$FIREBASE_DIR/dev-google-services.json"
          test -s "$FIREBASE_DIR/staging-google-services.json"
          test -s "$FIREBASE_DIR/production-google-services.json"
          {
            echo "ESC_ANDROID_KEYSTORE_PATH=$SIGNING_DIR/release.jks"
            echo "ESC_FIREBASE_ANDROID_CONFIG_DEV=$FIREBASE_DIR/dev-google-services.json"
            echo "ESC_FIREBASE_ANDROID_CONFIG_STAGING=$FIREBASE_DIR/staging-google-services.json"
            echo "ESC_FIREBASE_ANDROID_CONFIG_PRODUCTION=$FIREBASE_DIR/production-google-services.json"
          } >> "$GITHUB_ENV"

      - name: Validate repository Android isolation contract
        run: python3 scripts/verify_esc_android_isolation.py

      - name: Bootstrap isolated ESC Android platform
        shell: bash
        run: ./scripts/bootstrap_android.sh

      - name: Run ESC mobile quality gates
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build production-signed ESC APK
        working-directory: mobile
        shell: bash
        env:
          ESC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ESC_ANDROID_KEYSTORE_PASSWORD }}
          ESC_ANDROID_KEY_ALIAS: ${{ secrets.ESC_ANDROID_KEY_ALIAS }}
          ESC_ANDROID_KEY_PASSWORD: ${{ secrets.ESC_ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          flutter build apk --flavor production --release \
            --dart-define=ESC_ENV=production \
            --dart-define=ESC_API_BASE_URL="$API_BASE_URL"

      - name: Verify ESC package and signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ESC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-production-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/esc-apksigner.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/esc-apksigner.txt" | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "FAIL: ESC production APK signing certificate does not match ESC_ANDROID_CERT_SHA256" >&2
            exit 1
          fi
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='$ESC_APPLICATION_ID'" <<<"$BADGING"
          if grep -Fq "package: name='$SAFE_CONTRACT_APPLICATION_ID'" <<<"$BADGING"; then
            echo "FAIL: ESC APK resolved to the Safe Contract package" >&2
            exit 1
          fi
          python3 scripts/verify_esc_android_isolation.py --esc-apk "$APK" --aapt "$AAPT"

      - name: Prepare verified ESC retention artifact
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          DEVICE_EVIDENCE: ${{ inputs.device_evidence }}
          UAT_EVIDENCE: ${{ inputs.uat_evidence }}
          COEXISTENCE_EVIDENCE: ${{ inputs.coexistence_evidence }}
          FIREBASE_EVIDENCE: ${{ inputs.firebase_evidence }}
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-production-release.apk"
          test -s "$ESC_UAT_RECORD"
          test -s "$ESC_BRANCH_PROTECTION_AUDIT"
          python3 scripts/enterprise_verified_artifacts.py publish-apk \
            --apk "$APK" \
            --source-sha "$GITHUB_SHA" \
            --quality-run-id "$GITHUB_RUN_ID" \
            --quality-gates-passed \
            --api-base-url "$API_BASE_URL" \
            --signing-verified \
            --identity-verified \
            --firebase-identity-verified \
            --branch-protection-audit "$ESC_BRANCH_PROTECTION_AUDIT" \
            --uat-record "$ESC_UAT_RECORD" \
            --device-evidence "$DEVICE_EVIDENCE" \
            --uat-evidence "$UAT_EVIDENCE" \
            --coexistence-evidence "$COEXISTENCE_EVIDENCE" \
            --firebase-evidence "$FIREBASE_EVIDENCE"
          python3 scripts/enterprise_verified_artifacts.py check --require-apk

          AUDIT_COPY="Last verified Enterprise apk/ESC_BRANCH_PROTECTION_AUDIT.json"
          cp "$ESC_BRANCH_PROTECTION_AUDIT" "$AUDIT_COPY"
          ACTUAL_AUDIT_SHA256="$(sha256sum "$AUDIT_COPY" | awk '{print $1}')"
          if [[ "$ACTUAL_AUDIT_SHA256" != "$ESC_BRANCH_PROTECTION_AUDIT_SHA256" ]]; then
            echo "FAIL: retained stable branch-protection audit digest changed after validation" >&2
            exit 1
          fi
          printf '%s  %s\n' "$ACTUAL_AUDIT_SHA256" "$(basename "$AUDIT_COPY")" > "$AUDIT_COPY.sha256"

      - name: Retain verified ESC APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-safe-contracts-mobile-${{ github.sha }}-${{ github.run_id }}
          path: |
            Last verified Enterprise apk/EnterpriseSafeContracts-latest.apk
            Last verified Enterprise apk/EnterpriseSafeContracts-latest.apk.sha256
            Last verified Enterprise apk/VERIFIED.json
            Last verified Enterprise apk/ESC_BRANCH_PROTECTION_AUDIT.json
            Last verified Enterprise apk/ESC_BRANCH_PROTECTION_AUDIT.json.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish ESC-only stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          APK="Last verified Enterprise apk/EnterpriseSafeContracts-latest.apk"
          SHA_FILE="$APK.sha256"
          PROVENANCE="Last verified Enterprise apk/VERIFIED.json"
          PROTECTION_AUDIT="Last verified Enterprise apk/ESC_BRANCH_PROTECTION_AUDIT.json"
          PROTECTION_AUDIT_SHA="$PROTECTION_AUDIT.sha256"
          test -s "$APK"
          test -s "$SHA_FILE"
          test -s "$PROVENANCE"
          test -s "$PROTECTION_AUDIT"
          test -s "$PROTECTION_AUDIT_SHA"
          gh release delete esc-mobile-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create esc-mobile-latest \
            "$APK" \
            "$SHA_FILE" \
            "$PROVENANCE" \
            "$PROTECTION_AUDIT" \
            "$PROTECTION_AUDIT_SHA" \
            --target "$GITHUB_SHA" \
            --title "Enterprise Safe Contracts Mobile Latest" \
            --notes "$RELEASE_NOTES\n\nSource commit: $GITHUB_SHA\nProduct: Enterprise Safe Contracts\nBranch protection audit SHA-256: $ESC_BRANCH_PROTECTION_AUDIT_SHA256"
          gh release view esc-mobile-latest --json url,tagName,assets
