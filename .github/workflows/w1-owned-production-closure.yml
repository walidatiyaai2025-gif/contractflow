name: W1 Owned Production Closure

on:
  push:
    branches:
      - bugfix/alkenzy-register-w1-customer-navigation

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bugfix/alkenzy-register-w1-customer-navigation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Execute W1 owned production patch
        run: python3 scripts/w1_bug_closure_patch.py
      - name: Preserve integration-owned push registration exactly
        shell: bash
        run: |
          git fetch origin feat/alkenzy-mobile-reference-redesign
          git show origin/feat/alkenzy-mobile-reference-redesign:mobile/lib/features/notifications/push_registration.dart > mobile/lib/features/notifications/push_registration.dart
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Canonical format
        working-directory: mobile
        run: dart format lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Full normative Flutter regression suite
        working-directory: mobile
        shell: bash
        run: |
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
      - name: Capture W1 Arabic and English width matrix
        working-directory: mobile
        shell: bash
        run: |
          test -f test/worker1_visual_capture_test.dart
          for language in ar en; do
            for width in 320 360 375 390 412 430; do
              flutter test test/worker1_visual_capture_test.dart \
                --dart-define=W1_CAPTURE_WIDTH="$width" \
                --dart-define=W1_CAPTURE_LANG="$language"
            done
          done
      - name: Remove execution helpers and commit production closure
        shell: bash
        run: |
          rm -f .github/workflows/w1-owned-production-closure.yml
          rm -f scripts/w1_bug_closure_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(w1): close customer navigation register implementation"
          git push origin HEAD:bugfix/alkenzy-register-w1-customer-navigation
      - name: Upload W1 responsive evidence
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-w1-responsive-evidence
          path: mobile/build/w1-bug-closure/*.png
          if-no-files-found: error
          retention-days: 14
