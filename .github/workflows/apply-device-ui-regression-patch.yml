name: Apply device UI regression patch

on:
  push:
    branches:
      - fix/alkenzy-device-ui-regressions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/alkenzy-device-ui-regressions
          fetch-depth: 0

      - name: Apply targeted mobile UI patch
        run: python3 scripts/apply_device_ui_regression_patch.py

      - name: Remove one-shot patch infrastructure
        run: |
          rm -f scripts/apply_device_ui_regression_patch.py
          rm -f .github/workflows/apply-device-ui-regression-patch.yml

      - name: Commit production fix
        run: |
          git config user.name "alkenzy-ui-fix-bot"
          git config user.email "alkenzy-ui-fix-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mobile): close device UI regressions"
          git push origin HEAD:fix/alkenzy-device-ui-regressions
