name: ESC Foundation Gate

on:
  push:
    branches: [enterprise-safecontracts]
  pull_request:
    branches: [enterprise-safecontracts]

permissions:
  contents: read

jobs:
  esc-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: Validate Enterprise Safe Contracts foundation
        run: python3 scripts/validate-esc-foundation.py
      - name: Validate ESC Android identity and release isolation
        run: python3 scripts/verify_esc_android_isolation.py
      - name: Validate ESC release artifact isolation
        run: python3 scripts/enterprise_verified_artifacts.py check
      - name: Run backend regression and Enterprise tenancy tests
        run: ./scripts/test-php.sh

  esc-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Enforce Flutter formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Analyze Flutter client
        run: flutter analyze
      - name: Test Flutter client
        run: flutter test
