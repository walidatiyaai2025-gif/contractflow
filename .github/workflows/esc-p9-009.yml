name: ESC P9-009 Contract Retention Rules

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-retention-rules:
    name: contract-retention-rules
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production

      - name: Validate P9-009 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Database/Migrations/Migration0053EnterpriseContractFinancialRetentionRuleRevisions.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialRetentionRulePolicy.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialRetentionRuleRevisionRepository.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialRetentionRuleRevisionService.php
          php -l tests/php/enterprise_contract_financial_retention_rules_p9_009.php

      - name: Validate P9-009 retention rules
        run: php tests/php/enterprise_contract_financial_retention_rules_p9_009.php
