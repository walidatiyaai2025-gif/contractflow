name: Alkenzy 0.3.38 Flutter Format (feature branch)

on:
  push:
    branches:
      - feat/alkenzy-038-guest-rewarded-2m
    paths:
      - mobile/lib/features/ads/alkenzy_rewarded_fun.dart
      - mobile/lib/features/ads/alkenzy_rewarded_fun_service.dart
      - mobile/lib/features/ads/alkenzy_xo_match.dart
      - mobile/lib/features/ads/alkenzy_ad_units.dart
      - mobile/lib/features/ads/alkenzy_ad_placements.dart
      - mobile/lib/app.dart
      - mobile/test/alkenzy_ad_units_policy_test.dart
      - mobile/lib/features/welcome/company_welcome_screen.dart
      - mobile/test/mobile_landing_images_test.dart
      - mobile/lib/features/navigation/app_shell.dart
      - mobile/test/alkenzy_rewarded_xo_038_test.dart
      - .github/workflows/alkenzy-038-format.yml

permissions:
  contents: write

jobs:
  format-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-038-guest-rewarded-2m
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format only new feature and touched files
        working-directory: mobile
        run: |
          dart format             lib/features/ads/alkenzy_rewarded_fun.dart             lib/features/ads/alkenzy_rewarded_fun_service.dart             lib/features/ads/alkenzy_xo_match.dart             lib/features/ads/alkenzy_ad_units.dart             lib/features/welcome/company_welcome_screen.dart             lib/features/navigation/app_shell.dart             test/alkenzy_rewarded_xo_038_test.dart lib/app.dart lib/features/ads/alkenzy_ad_placements.dart test/alkenzy_ad_units_policy_test.dart test/mobile_landing_images_test.dart
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git add mobile/lib/features/ads/alkenzy_rewarded_fun.dart mobile/lib/features/ads/alkenzy_rewarded_fun_service.dart mobile/lib/features/ads/alkenzy_xo_match.dart mobile/lib/features/ads/alkenzy_ad_units.dart mobile/lib/features/welcome/company_welcome_screen.dart mobile/lib/features/navigation/app_shell.dart mobile/test/alkenzy_rewarded_xo_038_test.dart mobile/lib/app.dart mobile/lib/features/ads/alkenzy_ad_placements.dart mobile/test/alkenzy_ad_units_policy_test.dart mobile/test/mobile_landing_images_test.dart
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(alkenzy): apply Dart formatter to rewarded XO feature'
            git push origin HEAD:feat/alkenzy-038-guest-rewarded-2m
          fi
