name: SC P11 Temporary Dart Format

on:
  push:
    branches:
      - agent/sc-p11-004-mobile-suppliers-finance

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sc-p11-004-mobile-suppliers-finance
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format mobile sources
        run: dart format lib test
      - name: Commit canonical formatting
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/lib mobile/test; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib mobile/test
          git commit -m 'style: apply canonical Dart formatting'
          git push origin HEAD:agent/sc-p11-004-mobile-suppliers-finance
