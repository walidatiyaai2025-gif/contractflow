name: ESC P9-001 Enterprise Money Foundation

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-money:
    name: enterprise-money
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production

      - name: Validate P9-001 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Finance/CurrencyCode.php
          php -l wordpress-plugin/safecontracts/src/Finance/Money.php
          php -l tests/php/enterprise_money_p9_001.php

      - name: Validate P9-001 Enterprise Money foundation
        run: php tests/php/enterprise_money_p9_001.php
