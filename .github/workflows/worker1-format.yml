                    shape: BoxShape.circle,
                  ),
                  child: Icon(Icons.add_rounded, color: Colors.white),
                ),
              ),
            ),
          ),
        ),
      ),
    );
    await tester.pump();
    expect(tester.takeException(), isNull);
    expect(find.text('المزيد'), findsOneWidget);
  });

  testWidgets('file picker stacks action on a very narrow field', (tester) async {
    await tester.pumpWidget(
      MaterialApp(
        theme: SafeContractsTheme.build('ar'),
        home: Directionality(
          textDirection: TextDirection.rtl,
          child: Scaffold(
            body: SizedBox(
              width: 280,
              child: SafeContractsFilePickerField(
                label: 'صورة أو ملف العقد الرسمي طويل الاسم',
                actionLabel: 'اختيار ملف من الجهاز',
                fileName: 'very-long-contract-file-name-example.pdf',
                onTap: () {},
              ),
            ),
          ),
        ),
      ),
    );
    await tester.pump();
    expect(tester.takeException(), isNull);
    expect(find.text('اختيار ملف من الجهاز'), findsOneWidget);
  });
}
''')
          PY
      - name: Format and validate focused scope
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          git diff --check
          flutter analyze
          flutter test test/mobile_design_foundation_test.dart test/final_foundation_navigation_consistency_test.dart
      - name: Persist final consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/worker1-format.yml > .github/workflows/worker1-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mobile): finalize foundation navigation consistency"
          git push origin HEAD:mobile-redesign/foundation-auth-navigation
