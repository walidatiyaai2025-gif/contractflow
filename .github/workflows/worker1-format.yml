name: Worker1 Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format Worker 1 scoped source
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/features/welcome/company_welcome_screen.dart test/mobile_design_foundation_test.dart test/worker1_visual_capture_test.dart
      - name: Persist formatting
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/welcome/company_welcome_screen.dart mobile/test/mobile_design_foundation_test.dart mobile/test/worker1_visual_capture_test.dart
          if git diff --cached --quiet; then
            echo "Worker 1 sources already formatted."
          else
            git commit -m "style(mobile): apply worker1 formatter correction"
            git push origin "HEAD:${HEAD_REF}"
          fi
