}

'''
              return t[:insert_at] + notice + t[insert_at:]
          edit('mobile/lib/features/ui/safecontracts_components.dart', patch_components)

          def patch_form(t):
              insert_at = t.index('final class SafeContractsFilePickerField')
              checkbox = r'''final class SafeContractsCheckboxField extends StatelessWidget {
  const SafeContractsCheckboxField({
    required this.value,
    required this.label,
    required this.onChanged,
    this.subtitle,
