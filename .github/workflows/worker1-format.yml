                    style: Theme.of(context).textTheme.labelLarge?.copyWith(
                          fontWeight: FontWeight.w800,
                        ),
                  ),
                  if (fileName != null && fileName!.trim().isNotEmpty) ...[
                    const SizedBox(height: SafeContractsSpacing.xxs),
                    Text(
                      fileName!,
