    super.key,
  });

  final bool value;
  final String label;
  final String? subtitle;
  final ValueChanged<bool>? onChanged;
  final bool enabled;

  @override
  Widget build(BuildContext context) {
    final callback = enabled && onChanged != null
        ? () => onChanged!(!value)
        : null;
    return Material(
      color: Colors.transparent,
      child: InkWell(
        borderRadius: BorderRadius.circular(SafeContractsRadii.sm),
        onTap: callback,
        child: Padding(
          padding: const EdgeInsets.symmetric(vertical: SafeContractsSpacing.xs),
          child: Row(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Checkbox(
                value: value,
                onChanged: enabled && onChanged != null
                    ? (next) => onChanged!(next ?? false)
                    : null,
              ),
              const SizedBox(width: SafeContractsSpacing.xs),
              Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      label,
                      style: Theme.of(context).textTheme.bodyMedium?.copyWith(
                            fontWeight: FontWeight.w800,
                          ),
                    ),
                    if (subtitle != null && subtitle!.trim().isNotEmpty) ...[
                      const SizedBox(height: SafeContractsSpacing.xxs),
                      Text(
                        subtitle!,
                        style: Theme.of(context).textTheme.bodySmall?.copyWith(
                              color: SafeContractsVisual.muted,
                              height: 1.4,
                            ),
                      ),
                    ],
                  ],
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }
}

'''
              t = t[:insert_at] + checkbox + t[insert_at:]
              start = t.index('  @override\n  Widget build(BuildContext context) {', t.index('final class SafeContractsFilePickerField'))
              end = t.index('\n  }\n}', start) + len('\n  }')
              old_method = t[start:end]
              new_method = r'''  @override
  Widget build(BuildContext context) {
