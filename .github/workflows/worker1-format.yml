  }'''
              return t[:start] + new_method + t[end:]
          edit('mobile/lib/features/ui/safecontracts_form.dart', patch_form)

          def patch_login(t):
              old = '''                                        CheckboxListTile(\n                                          value: widget.controller.rememberMe,\n                                          onChanged: submitting\n                                              ? null\n                                              : (value) => widget.controller\n                                                  .setRememberMe(\n                                                      value ?? false),\n                                          contentPadding: EdgeInsets.zero,\n                                          dense: true,\n                                          controlAffinity:\n                                              ListTileControlAffinity.leading,\n                                          title: Text(\n                                            l10n.t('Remember me'),\n                                            style: const TextStyle(\n                                              fontWeight: FontWeight.w800,\n                                            ),\n                                          ),\n                                          subtitle: Text(\n                                            l10n.t(\n                                              'Keep me signed in on this device. Your password is never stored.',\n                                            ),\n                                            style: const TextStyle(\n                                              color: SafeContractsVisual.muted,\n                                            ),\n                                          ),\n                                        ),'''
              new = '''                                        SafeContractsCheckboxField(\n                                          value: widget.controller.rememberMe,\n                                          enabled: !submitting,\n                                          onChanged: (value) => widget.controller\n                                              .setRememberMe(value),\n                                          label: l10n.t('Remember me'),\n                                          subtitle: l10n.t(\n                                            'Keep me signed in on this device. Your password is never stored.',\n                                          ),\n                                        ),'''
              return one(t, old, new, 'login remember-me field')
          edit('mobile/lib/features/auth/login_screen.dart', patch_login)

          def patch_shell(t):
              old_banner = '''            if (widget.usingConfigDefaults)\n              MaterialBanner(\n                backgroundColor: SafeContractsVisual.amberSoft,\n                leading: const Icon(\n                  Icons.info_outline_rounded,\n                  color: SafeContractsVisual.amber,\n                ),\n                content: Text(\n                  l10n.t(\n                    'Remote mobile configuration is unavailable. Safe defaults are active.',\n                  ),\n                ),\n                actions: const <Widget>[SizedBox.shrink()],\n              ),'''
              new_banner = '''            if (widget.usingConfigDefaults)\n              SafeContractsNotice(\n                message: l10n.t(\n                  'Remote mobile configuration is unavailable. Safe defaults are active.',\n                ),\n                icon: Icons.cloud_off_outlined,\n                tone: SafeContractsStatusTone.warning,\n              ),'''
              t = one(t, old_banner, new_banner, 'legacy config MaterialBanner')
              old_fab = '''      floatingActionButton: quickAdds.isEmpty\n          ? null\n          : _QuickAddFab(\n              tooltip: l10n.isArabic ? 'إضافة جديدة' : 'Quick add',\n              onPressed: () => unawaited(_showQuickAdd(quickAdds)),\n            ),\n      floatingActionButtonLocation: FloatingActionButtonLocation.endFloat,\n      bottomNavigationBar: bottomItems.isEmpty\n          ? null\n          : _SafeContractsBottomNavigation(\n              items: bottomItems,\n              selected: _selected,\n              onSelected: _selectDestination,\n              moreLabel: l10n.isArabic ? 'المزيد' : 'More',\n              onMore: () => _scaffoldKey.currentState?.openDrawer(),\n            ),'''
              new_fab = '''      bottomNavigationBar: bottomItems.isEmpty\n          ? null\n          : _SafeContractsBottomNavigation(\n              items: bottomItems,\n              selected: _selected,\n              onSelected: _selectDestination,\n              moreLabel: l10n.isArabic ? 'المزيد' : 'More',\n              moreSelected: !bottomItems.any(\n                (item) => item.value == _selected,\n              ),\n              onMore: () => _scaffoldKey.currentState?.openDrawer(),\n              centerAction: quickAdds.isEmpty\n                  ? null\n                  : Transform.translate(\n                      offset: const Offset(0, -8),\n                      child: _QuickAddFab(\n                        tooltip: l10n.isArabic ? 'إضافة جديدة' : 'Quick add',\n                        onPressed: () => unawaited(_showQuickAdd(quickAdds)),\n                      ),\n                    ),\n            ),'''
              t = one(t, old_fab, new_fab, 'floating quick add')
              t = one(
                  t,
                  '''    const preferred = <MobileDestination>[\n      MobileDestination.dashboard,\n      MobileDestination.contracts,\n      MobileDestination.payments,\n      MobileDestination.customers,\n    ];''',
                  '''    const preferred = <MobileDestination>[\n      MobileDestination.dashboard,\n      MobileDestination.contracts,\n      MobileDestination.customers,\n    ];''',
                  'reference bottom navigation hierarchy')
              t = one(
                  t,
                  '''    required this.moreLabel,\n    required this.onMore,\n  });''',
                  '''    required this.moreLabel,\n    required this.onMore,\n    required this.moreSelected,\n    required this.centerAction,\n  });''',
                  'bottom navigation wrapper constructor')
              t = one(
                  t,
                  '''  final String moreLabel;\n  final VoidCallback onMore;''',
                  '''  final String moreLabel;\n  final VoidCallback onMore;\n  final bool moreSelected;\n  final Widget? centerAction;''',
