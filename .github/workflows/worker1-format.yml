name: Worker1 Final Consistency QA

on:
  push:
    branches:
      - mobile-redesign/foundation-auth-navigation

permissions:
  contents: write

jobs:
  final-consistency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-redesign/foundation-auth-navigation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply final foundation and navigation consistency patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              p = Path(path)
              old = p.read_text()
              new = transform(old)
              if new == old:
                  raise SystemExit(f'no change produced for {path}')
              p.write_text(new)

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          edit('mobile/lib/features/ui/safecontracts_design.dart', lambda t: one(
              t,
              '  static const radius = 22.0;\n  static const compactRadius = 16.0;',
              '  static const radius = 18.0;\n  static const compactRadius = 14.0;',
              'locked visual radii'))

          def patch_theme(t):
              old = '''      navigationBarTheme: NavigationBarThemeData(\n        height: SafeContractsControlSizes.bottomNavigationHeight,\n        backgroundColor: SafeContractsVisual.surface,\n        indicatorColor: SafeContractsVisual.roseGoldSoft,\n        iconTheme: WidgetStateProperty.resolveWith(\n          (states) => IconThemeData(\n            color: states.contains(WidgetState.selected)\n                ? SafeContractsVisual.navy\n                : SafeContractsVisual.muted,\n          ),\n        ),\n        labelTextStyle: WidgetStateProperty.resolveWith(\n          (states) => textTheme.labelSmall?.copyWith(\n            color: states.contains(WidgetState.selected)\n                ? SafeContractsVisual.navy\n                : SafeContractsVisual.muted,\n            fontWeight: states.contains(WidgetState.selected)\n                ? FontWeight.w800\n                : FontWeight.w600,\n          ),\n        ),\n      ),'''
              new = '''      navigationBarTheme: NavigationBarThemeData(\n        height: SafeContractsControlSizes.bottomNavigationHeight,\n        backgroundColor: SafeContractsVisual.navyDeep,\n        indicatorColor: SafeContractsVisual.roseGold.withValues(alpha: 0.16),\n        iconTheme: WidgetStateProperty.resolveWith(\n          (states) => IconThemeData(\n            color: states.contains(WidgetState.selected)\n                ? SafeContractsVisual.roseGoldSoft\n                : Colors.white.withValues(alpha: 0.68),\n          ),\n        ),\n        labelTextStyle: WidgetStateProperty.resolveWith(\n          (states) => textTheme.labelSmall?.copyWith(\n            color: states.contains(WidgetState.selected)\n                ? Colors.white\n                : Colors.white.withValues(alpha: 0.68),\n            fontWeight: states.contains(WidgetState.selected)\n                ? FontWeight.w800\n                : FontWeight.w600,\n          ),\n        ),\n      ),'''
              return one(t, old, new, 'dark navigation theme')
          edit('mobile/lib/features/ui/safecontracts_theme.dart', patch_theme)

          def patch_components(t):
              start = t.index('final class SafeContractsBottomNavigation<T>')
              end = t.index('final class _NavigationTile', start)
              replacement = r'''final class SafeContractsBottomNavigation<T> extends StatelessWidget {
  const SafeContractsBottomNavigation({
    required this.items,
    required this.selected,
    required this.onSelected,
    this.moreLabel,
    this.onMore,
    this.moreSelected = false,
    this.centerAction,
    this.centerActionWidth = 64,
    super.key,
  });

  final List<SafeContractsNavigationItem<T>> items;
  final T selected;
  final ValueChanged<T> onSelected;
  final String? moreLabel;
  final VoidCallback? onMore;
  final bool moreSelected;
  final Widget? centerAction;
  final double centerActionWidth;

  @override
  Widget build(BuildContext context) {
    final tiles = <Widget>[
      for (final item in items)
        Expanded(
          child: _NavigationTile(
            label: item.label,
            icon: item.icon,
            selectedIcon: item.selectedIcon,
            selected: item.value == selected,
            onTap: () => onSelected(item.value),
          ),
        ),
      if (onMore != null && moreLabel != null)
        Expanded(
          child: _NavigationTile(
            label: moreLabel!,
            icon: Icons.grid_view_rounded,
            selected: moreSelected,
            onTap: onMore!,
          ),
        ),
    ];
    final split = centerAction == null ? tiles.length : (tiles.length + 1) ~/ 2;

    return SafeArea(
      top: false,
      child: Container(
        constraints: const BoxConstraints(
          minHeight: SafeContractsControlSizes.bottomNavigationHeight,
        ),
        decoration: const BoxDecoration(
          color: SafeContractsVisual.navyDeep,
          border: Border(
            top: BorderSide(color: SafeContractsVisual.navyRaised),
          ),
          boxShadow: SafeContractsShadows.navigation,
        ),
        padding: const EdgeInsets.fromLTRB(5, 5, 5, 4),
        child: Row(
          crossAxisAlignment: CrossAxisAlignment.center,
          children: [
            ...tiles.take(split),
            if (centerAction != null)
              SizedBox(
                width: centerActionWidth,
                child: Center(child: centerAction),
              ),
            ...tiles.skip(split),
          ],
        ),
      ),
    );
  }
}

'''
              t = t[:start] + replacement + t[end:]
              t = one(
                  t,
                  '''            color: selected\n                ? SafeContractsVisual.roseGoldSoft.withValues(alpha: 0.88)\n                : Colors.transparent,''',
                  '''            color: selected\n                ? SafeContractsVisual.roseGold.withValues(alpha: 0.16)\n                : Colors.transparent,''',
                  'selected nav background')
              t = one(
                  t,
                  '''                color: selected\n                    ? SafeContractsVisual.navyDeep\n                    : SafeContractsVisual.muted,''',
                  '''                color: selected\n                    ? SafeContractsVisual.roseGoldSoft\n                    : Colors.white.withValues(alpha: 0.68),''',
                  'nav icon colors')
              t = one(
                  t,
                  '''                      color: selected\n                          ? SafeContractsVisual.navyDeep\n                          : SafeContractsVisual.muted,''',
                  '''                      color: selected\n                          ? Colors.white\n                          : Colors.white.withValues(alpha: 0.68),''',
                  'nav label colors')

              insert_at = t.index('final class SafeContractsBottomSheetShell')
              notice = r'''final class SafeContractsNotice extends StatelessWidget {
