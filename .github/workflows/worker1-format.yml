                  'bottom navigation wrapper forwarding')
              return t
          edit('mobile/lib/features/navigation/app_shell.dart', patch_shell)

          Path('mobile/test/final_foundation_navigation_consistency_test.dart').write_text(r'''import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:safecontracts_mobile/features/ui/safecontracts_components.dart';
import 'package:safecontracts_mobile/features/ui/safecontracts_design.dart';
import 'package:safecontracts_mobile/features/ui/safecontracts_form.dart';
import 'package:safecontracts_mobile/features/ui/safecontracts_theme.dart';

void main() {
  test('locked card radii use the 18 / 14 reference geometry', () {
    expect(SafeContractsVisual.radius, 18);
    expect(SafeContractsVisual.compactRadius, 14);
  });

  testWidgets('dark navigation with center action is safe at 320px RTL', (
    tester,
  ) async {
    addTearDown(() => tester.binding.setSurfaceSize(null));
    await tester.binding.setSurfaceSize(const Size(320, 640));
    await tester.pumpWidget(
      MaterialApp(
        theme: SafeContractsTheme.build('ar'),
        home: Directionality(
          textDirection: TextDirection.rtl,
          child: Scaffold(
            bottomNavigationBar: SafeContractsBottomNavigation<int>(
              items: const [
