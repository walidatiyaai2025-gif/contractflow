name: ESC P9-005 Contract Financial Adjustments

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-financial-adjustments:
    name: contract-financial-adjustments
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production

      - name: Validate P9-005 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Database/Migrations/Migration0050EnterpriseContractFinancialAdjustmentRevisions.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialAdjustmentPolicy.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialAdjustmentRevisionRepository.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialAdjustmentRevisionService.php
          php -l tests/php/enterprise_contract_financial_adjustments_p9_005.php

      - name: Validate P9-005 Contract financial adjustments
        run: php tests/php/enterprise_contract_financial_adjustments_p9_005.php
