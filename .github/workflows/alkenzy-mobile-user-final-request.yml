name: ALKENZY Mobile User Final Request

on:
  push:
    branches:
      - feat/alkenzy-mobile-user-final-request

permissions:
  contents: write

jobs:
  validate-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-user-final-request
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply final compile fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/alkenzy_mobile_final_compile_fix.py
          cd mobile
          flutter pub get
          dart format \
            lib/features/reports/report_printing.dart \
            lib/features/ui/safecontracts_theme.dart \
            lib/features/ui/theme_palette.dart
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/reports/report_printing.dart \
            mobile/lib/features/ui/safecontracts_theme.dart \
            mobile/lib/features/ui/theme_palette.dart
          git diff --cached --check
          git commit -m "fix(mobile): close final report and palette compile deltas"
          git push origin HEAD:feat/alkenzy-mobile-user-final-request
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Prepare Android host
        run: bash scripts/bootstrap_android.sh
      - name: Build final APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=SC_ENV=production
          --dart-define=SC_API_BASE_URL=https://sys.alkenzy.com/wp-json/safecontracts/v1/
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-adv-final-user-request-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
