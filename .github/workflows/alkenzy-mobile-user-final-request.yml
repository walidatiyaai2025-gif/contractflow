name: ALKENZY Mobile User Final Request

on:
  push:
    branches:
      - feat/alkenzy-mobile-user-final-request

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-user-final-request
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Materialize feature code
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/alkenzy_mobile_final_prepare.py pre
          python3 scripts/alkenzy_mobile_user_final_patch.py
          python3 scripts/alkenzy_mobile_final_prepare.py post
          cd mobile
          flutter pub get
          dart format \
            lib/app.dart \
            lib/core/auth/biometric_auth.dart \
            lib/features/auth/login_screen.dart \
            lib/features/auth/mobile_auth.dart \
            lib/features/contracts/contracts.dart \
            lib/features/contracts/contracts_screen.dart \
            lib/features/customers/customers_screen.dart \
            lib/features/help/mobile_user_guide_screen.dart \
            lib/features/navigation/app_shell.dart \
            lib/features/payments/payments.dart \
            lib/features/payments/payments_screen.dart \
            lib/features/reports/report_printing.dart \
            lib/features/reports/reports_screen.dart \
            lib/features/ui/safecontracts_theme.dart \
            lib/features/ui/theme_palette.dart
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile scripts/bootstrap_android.sh .github/workflows/quality-gates.yml
          git diff --cached --check
          git commit -m "feat(mobile): materialize biometric reports printing themes and sidebar"
          git push origin HEAD:feat/alkenzy-mobile-user-final-request
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Prepare Android host
        run: bash scripts/bootstrap_android.sh
      - name: Build final APK
        working-directory: mobile
        run: >-
          flutter build apk --debug
          --dart-define=SC_ENV=production
          --dart-define=SC_API_BASE_URL=https://sys.alkenzy.com/wp-json/safecontracts/v1/
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-adv-final-user-request-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
