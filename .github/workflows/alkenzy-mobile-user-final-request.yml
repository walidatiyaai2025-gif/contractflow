name: ALKENZY Mobile User Final Request

on:
  push:
    branches:
      - feat/alkenzy-mobile-user-final-request

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-user-final-request
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply and validate complete mobile request
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=bootstrap
          fail() {
            rc=$?
            set +e
            {
              echo "stage=$stage"
              echo "head=$(git rev-parse HEAD)"
              echo "exit=$rc"
              echo "--- apply ---"
              tail -n 180 /tmp/alkenzy-apply.log 2>/dev/null || true
              echo "--- pubget ---"
              tail -n 180 /tmp/alkenzy-pubget.log 2>/dev/null || true
              echo "--- analyze ---"
              tail -n 240 /tmp/alkenzy-analyze.log 2>/dev/null || true
              echo "--- tests ---"
              tail -n 280 /tmp/alkenzy-tests.log 2>/dev/null || true
              echo "--- android ---"
              tail -n 240 /tmp/alkenzy-android.log 2>/dev/null || true
            } > .github/ALKENZY_USER_FINAL_FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ALKENZY_USER_FINAL_FAILURE.txt
            git commit -m "ci(mobile): record final request failure at $stage" || true
            git push origin HEAD:feat/alkenzy-mobile-user-final-request || true
            exit "$rc"
          }
          trap fail ERR

          stage=normalize-patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/alkenzy_mobile_user_final_patch.py')
          text = p.read_text()
          old = '''insert_before(
              path,
              "  @override\\n  Widget build(BuildContext context) {\\n",
              "  Future<void> _offerBiometricEnrollment() async {\\n"'''
          new = '''insert_before(
              path,
              "  @override\\n  Widget build(BuildContext context) {\\n    final l10n = context.scL10n;\\n    if (_bootstrapping) {\\n",
              "  Future<void> _offerBiometricEnrollment() async {\\n"'''
          if old not in text:
              raise SystemExit('Unable to normalize unique login state build marker.')
          p.write_text(text.replace(old, new, 1))
          PY

          stage=apply
          python3 scripts/alkenzy_mobile_user_final_patch.py 2>&1 | tee /tmp/alkenzy-apply.log

          stage=pubget
          cd mobile
          flutter pub get 2>&1 | tee /tmp/alkenzy-pubget.log

          stage=format
          dart format lib test

          stage=analyze
          flutter analyze 2>&1 | tee /tmp/alkenzy-analyze.log

          stage=tests
          flutter test 2>&1 | tee /tmp/alkenzy-tests.log
          cd ..

          stage=android
          bash scripts/bootstrap_android.sh 2>&1 | tee /tmp/alkenzy-android.log
          cd mobile
          flutter build apk --debug \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL=https://sys.alkenzy.com/wp-json/safecontracts/v1/ \
            2>&1 | tee -a /tmp/alkenzy-android.log
          cd ..

          stage=commit
          rm -f .github/ALKENZY_USER_FINAL_FAILURE.txt
          rm -f .github/workflows/alkenzy-mobile-user-final-request.yml
          rm -f scripts/alkenzy_mobile_user_final_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(mobile): biometric login reports printing themes and sidebar"
          git push origin HEAD:feat/alkenzy-mobile-user-final-request
