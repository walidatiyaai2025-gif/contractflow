name: ALKENZY Mobile User Final Request

on:
  push:
    branches:
      - feat/alkenzy-mobile-user-final-request

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-user-final-request
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Format
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Prepare Android host
        run: bash scripts/bootstrap_android.sh
      - name: Build final release APK
        working-directory: mobile
        run: >-
          flutter build apk --release
          --dart-define=SC_ENV=production
          --dart-define=SC_API_BASE_URL=https://sys.alkenzy.com/wp-json/safecontracts/v1/
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-adv-final-user-request-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
