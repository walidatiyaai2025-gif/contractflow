name: ALKENZY Mobile User Final Request

on:
  push:
    branches:
      - feat/alkenzy-mobile-user-final-request

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-user-final-request
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply, materialize and validate final mobile request
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/alkenzy_mobile_user_final_patch.py')
          text = p.read_text()
          old = '''insert_before(
              path,
              "  @override\\n  Widget build(BuildContext context) {\\n",
              "  Future<void> _offerBiometricEnrollment() async {\\n"'''
          new = '''insert_before(
              path,
              "  @override\\n  Widget build(BuildContext context) {\\n    final l10n = context.scL10n;\\n    if (_bootstrapping) {\\n",
              "  Future<void> _offerBiometricEnrollment() async {\\n"'''
          if old not in text:
              raise SystemExit('Unable to normalize unique login state build marker.')
          text = text.replace(old, new, 1)
          for old_marker, new_marker in [
              (
                  'replace_once(path, "        backgroundColor: SafeContractsVisual.navy,", "        backgroundColor: palette.primary,")',
                  'write(path, read(path).replace("        backgroundColor: SafeContractsVisual.navy,", "        backgroundColor: palette.primary,", 1))',
              ),
              (
                  'replace_once(path, "          foregroundColor: SafeContractsVisual.navy,", "          foregroundColor: palette.primary,")',
                  'write(path, read(path).replace("          foregroundColor: SafeContractsVisual.navy,", "          foregroundColor: palette.primary,", 1))',
              ),
          ]:
              if old_marker not in text:
                  raise SystemExit(f'Unable to normalize theme marker: {old_marker}')
              text = text.replace(old_marker, new_marker, 1)
          p.write_text(text)
          PY

          python3 scripts/alkenzy_mobile_user_final_patch.py

          python3 - <<'PY'
          from pathlib import Path

          reports = Path('mobile/lib/features/reports/reports_screen.dart')
          text = reports.read_text()
          marker = ".map((row) => Map<String, Object?>.from(row))"
          if text.count(marker) != 2:
              raise SystemExit(f'Unexpected reports row mapping count: {text.count(marker)}')
          text = text.replace(
              marker,
              ".map((row) => apiObjectMap(row, 'reports.${definition.id}.row'))",
          )
          reports.write_text(text)

          guide = Path('mobile/lib/features/help/mobile_user_guide_screen.dart')
          text = guide.read_text()
          marker = "    MobileDestination.profile => const _GuideEntry("
          addition = """    MobileDestination.reports => const _GuideEntry(
        destination: MobileDestination.reports,
        title: 'Reports',
        icon: Icons.assessment_outlined,
        purpose:
            'Reports provides authorized printable views of customers, contracts, payments and operational data.',
        steps: <String>[
          'Choose the report that matches the business data you need.',
          'Review the loaded rows, then export them as PDF, Word or Excel.',
        ],
      ),
"""
          if marker not in text or 'MobileDestination.reports => const _GuideEntry(' in text:
              raise SystemExit('Unexpected reports guide state.')
          guide.write_text(text.replace(marker, addition + marker, 1))
          PY

          cd mobile
          flutter pub get
          dart format lib test
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile scripts/bootstrap_android.sh .github/workflows/quality-gates.yml
          git diff --cached --check
          git commit -m "feat(mobile): materialize biometric reports printing themes and sidebar"
          git push origin HEAD:feat/alkenzy-mobile-user-final-request

          cd mobile
          flutter analyze
          flutter test
          cd ..

          bash scripts/bootstrap_android.sh
          cd mobile
          flutter build apk --debug \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL=https://sys.alkenzy.com/wp-json/safecontracts/v1/
          cd ..

          rm -f .github/workflows/alkenzy-mobile-user-final-request.yml
          rm -f scripts/alkenzy_mobile_user_final_patch.py
          git add -A
          git diff --cached --check
          git commit -m "chore(mobile): remove final request build helpers"
          git push origin HEAD:feat/alkenzy-mobile-user-final-request
      - name: Upload final APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-adv-final-user-request-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
