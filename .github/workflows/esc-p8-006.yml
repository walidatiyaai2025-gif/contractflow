name: ESC P8-006 Contract Term Expiry Gate

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-term-expiry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production
      - name: Validate P8-006 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Expiry/ContractTermExpiryPolicy.php
          php -l wordpress-plugin/safecontracts/src/Expiry/ContractTermExpiryRepository.php
          php -l wordpress-plugin/safecontracts/src/Expiry/ContractTermExpiryService.php
          php -l tests/php/enterprise_contract_term_expiry_p8_006.php
      - name: Validate ESC-P8-006 Contract Term Expiry evaluation
        run: php tests/php/enterprise_contract_term_expiry_p8_006.php
