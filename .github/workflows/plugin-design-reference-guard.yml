name: Plugin Design Reference Guard

on:
  pull_request:
    paths:
      - 'assets/design/plugin-redesign/reference/**'
      - 'docs/plugin-redesign/**'
      - 'scripts/validate-plugin-design-references.py'
      - 'AGENTS.md'
  push:
    branches: [ main ]
    paths:
      - 'assets/design/plugin-redesign/reference/**'
      - 'docs/plugin-redesign/**'
      - 'scripts/validate-plugin-design-references.py'
      - 'AGENTS.md'

jobs:
  validate-plugin-design-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify locked ALKENZY ADV design references and ownership
        run: python3 scripts/validate-plugin-design-references.py
