name: Retain Verified Plugin

on:
  workflow_run:
    workflows: ["Quality Gates"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: retain-verified-plugin-main
  cancel-in-progress: false

jobs:
  retain-plugin:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ensure green source still matches current plugin source
        env:
          VERIFIED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$VERIFIED_SOURCE_SHA^{commit}"
          if ! git diff --quiet "$VERIFIED_SOURCE_SHA"..HEAD -- wordpress-plugin/safecontracts; then
            echo "SafeContracts plugin source changed after the verified run; a newer main Quality Gates run must publish it." >&2
            exit 1
          fi

      - name: Build and validate exact plugin package
        run: |
          set -euo pipefail
          python3 scripts/package_plugin.py build --output dist/SafeContracts-plugin-candidate.zip
          python3 scripts/package_plugin.py check dist/SafeContracts-plugin-candidate.zip

      - name: Retain only when binary changed
        id: retain
        env:
          VERIFIED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          CANDIDATE="dist/SafeContracts-plugin-candidate.zip"
          RETAINED="Last verified Plugin/SafeContracts-latest.zip"
          CANDIDATE_SHA="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          if [[ -f "$RETAINED" ]]; then
            RETAINED_SHA="$(sha256sum "$RETAINED" | awk '{print $1}')"
            if [[ "$CANDIDATE_SHA" == "$RETAINED_SHA" ]]; then
              echo "Plugin binary is already the latest verified package ($CANDIDATE_SHA)."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          python3 scripts/verified_artifacts.py publish-plugin \
            --plugin "$CANDIDATE" \
            --source-sha "$VERIFIED_SOURCE_SHA" \
            --quality-run-id "$VERIFIED_RUN_ID" \
            --quality-gates-passed
          python3 scripts/verified_artifacts.py check --require-plugin
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit retained verified plugin
        if: steps.retain.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "safecontracts-release-bot"
          git config user.email "safecontracts-release-bot@users.noreply.github.com"
          git add -- "Last verified Plugin/SafeContracts-latest.zip" \
            "Last verified Plugin/SafeContracts-latest.zip.sha256" \
            "Last verified Plugin/VERIFIED.json"
          git commit -m "release(plugin): retain latest verified SafeContracts ZIP"
          git push origin HEAD:main
