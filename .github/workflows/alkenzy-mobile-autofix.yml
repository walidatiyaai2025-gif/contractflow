name: Alkenzy mobile Dart autofix

on:
  push:
    branches:
      - alkenzy-play-ads

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alkenzy-play-ads
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format mobile Dart sources
        run: dart format mobile/lib mobile/test
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/lib mobile/test; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "Format Alkenzy mobile landing"
          git push origin HEAD:alkenzy-play-ads
