name: W1 Bug Closure Execute

on:
  pull_request:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bugfix/alkenzy-register-w1-customer-navigation
      - name: Reconcile shared push registration from integration
        shell: bash
        run: |
          git show origin/feat/alkenzy-mobile-reference-redesign:mobile/lib/features/notifications/push_registration.dart > mobile/lib/features/notifications/push_registration.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Normalize temporary patch literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/w1_bug_closure_patch.py')
          text = path.read_text()
          bad = '"label: Text(context.scL10n.t(\'Edit\')),' + chr(10) + '",'
          good = '"label: Text(context.scL10n.t(\'Edit\')),\\n",'
          if text.count(bad) != 1:
              raise SystemExit('temporary Edit literal repair target not unique')
          text = text.replace(bad, good, 1)
          old_sub = 'next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new_sub = 'next_text, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=flags)'
          if text.count(old_sub) != 1:
              raise SystemExit('sub_once literal-preservation target not unique')
          text = text.replace(old_sub, new_sub, 1)
          old_message = r": '$fallback\n${rawError.trim()}';"
          new_message = r": '$fallback\\n${rawError.trim()}';"
          if text.count(old_message) != 1:
              raise SystemExit('B002 message newline target not unique')
          text = text.replace(old_message, new_message, 1)
          path.write_text(text)
          PY
          python3 -m py_compile scripts/w1_bug_closure_patch.py
      - name: Apply whitespace-stable Worker 1 closure patch
        run: python3 scripts/w1_bug_closure_patch.py
      - name: Remove W1 lint-only qualifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mobile/lib/features/navigation/app_shell.dart')
          text = path.read_text()
          old = 'selected: destination == this.selected,'
          new = 'selected: destination == selected,'
          if text.count(old) != 1:
              raise SystemExit('W1 selected qualifier target not unique')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Format all mobile Dart sources and tests
        working-directory: mobile
        run: dart format lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Run regression suite
        working-directory: mobile
        shell: bash
        run: |
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
      - name: Capture Worker 1 Arabic and English responsive evidence
        working-directory: mobile
        shell: bash
        run: |
          for language in ar en; do
            for width in 320 360 375 390 412 430; do
              flutter test test/worker1_visual_capture_test.dart \
                --dart-define=W1_CAPTURE_WIDTH="$width" \
                --dart-define=W1_CAPTURE_LANG="$language"
            done
          done
      - name: Remove temporary execution helpers
        run: rm .github/workflows/w1-bug-closure-patch.yml .github/workflows/w1-bug-closure-run.yml scripts/w1_bug_closure_patch.py
      - name: Commit validated bug closure
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "alkenzy-w1-bug-closure"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/features/customers/customers_screen.dart \
                  mobile/lib/features/navigation/app_shell.dart \
                  mobile/lib/features/welcome/premium_compact_welcome_screen.dart \
                  mobile/lib/features/notifications/push_registration.dart \
                  mobile/test/alkenzy_w1_bug_closure_test.dart \
                  mobile/test/worker1_visual_capture_test.dart \
                  mobile/test/w1_customer_visual_capture.dart \
                  .github/workflows/w1-bug-closure-patch.yml \
                  .github/workflows/w1-bug-closure-run.yml \
                  scripts/w1_bug_closure_patch.py
          git commit -m "fix(mobile): close W1 customer and navigation register bugs"
          git push origin HEAD:bugfix/alkenzy-register-w1-customer-navigation
      - name: Upload Worker 1 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-w1-bug-closure-screenshots
          path: mobile/build/w1-bug-closure/*.png
          if-no-files-found: error
          retention-days: 14
