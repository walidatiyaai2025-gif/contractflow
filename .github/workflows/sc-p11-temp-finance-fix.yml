name: SC P11 Temporary Finance Fix

on:
  push:
    branches:
      - agent/sc-p11-004-mobile-suppliers-finance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sc-p11-004-mobile-suppliers-finance
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply explicit finance model patch
        run: python scripts/sc_p11_finance_model_fix.py
      - name: Resolve and format
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test SC-P11-004 regressions
        working-directory: mobile
        run: flutter test test/sc_p11_004_suppliers_finance_test.dart
      - name: Commit verified finance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/lib/features/finance/finance.dart mobile/test/sc_p11_004_suppliers_finance_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: enforce SC-P11 finance counterparty invariants'
          git push origin HEAD:agent/sc-p11-004-mobile-suppliers-finance
