name: Vendor Mobile Capture Fonts

on:
  push:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-reference-redesign
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Vendor approved Cairo assets and make capture offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/assets/fonts

          curl --fail --location --retry 4 \
            'https://fonts.gstatic.com/s/a/499cfb76477dbf03ca3791ba7177f2e128f250cfb34bbb9384dbf4f28b253c97.ttf' \
            --output mobile/assets/fonts/Cairo-Regular.ttf
          curl --fail --location --retry 4 \
            'https://fonts.gstatic.com/s/a/9d8500907f73132b06cf33a2ce1c28dc36018c7f5588ffd8638774103fde0077.ttf' \
            --output mobile/assets/fonts/Cairo-Medium.ttf

          printf '%s  %s\n' \
            '499cfb76477dbf03ca3791ba7177f2e128f250cfb34bbb9384dbf4f28b253c97' \
            'mobile/assets/fonts/Cairo-Regular.ttf' \
            '9d8500907f73132b06cf33a2ce1c28dc36018c7f5588ffd8638774103fde0077' \
            'mobile/assets/fonts/Cairo-Medium.ttf' \
            | sha256sum --check --strict
          test "$(stat -c %s mobile/assets/fonts/Cairo-Regular.ttf)" = '91476'
          test "$(stat -c %s mobile/assets/fonts/Cairo-Medium.ttf)" = '91652'

          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('mobile/pubspec.yaml')
          text = pubspec.read_text()
          marker = '    - assets/brand/alkenzy_adv.png\n'
          addition = marker + '    - assets/fonts/\n'
          if '    - assets/fonts/\n' not in text:
              if marker not in text:
                  raise SystemExit('brand asset marker missing from pubspec')
              text = text.replace(marker, addition, 1)
              pubspec.write_text(text)

          capture = Path('mobile/test/reference_visual_capture_test.dart')
          text = capture.read_text()
          import_marker = "import 'package:flutter_test/flutter_test.dart';\n"
          google_import = "import 'package:google_fonts/google_fonts.dart';\n"
          if google_import not in text:
              if import_marker not in text:
                  raise SystemExit('flutter_test import marker missing')
              text = text.replace(import_marker, import_marker + google_import, 1)

          main_marker = 'void main() {\n'
          setup = (
              "void main() {\n"
              "  setUpAll(() {\n"
              "    GoogleFonts.config.allowRuntimeFetching = false;\n"
              "  });\n"
              "  tearDownAll(() {\n"
              "    GoogleFonts.config.allowRuntimeFetching = true;\n"
              "  });\n\n"
          )
          if 'GoogleFonts.config.allowRuntimeFetching = false;' not in text:
              if main_marker not in text:
                  raise SystemExit('capture main marker missing')
              text = text.replace(main_marker, setup, 1)
          capture.write_text(text)
          PY

          cd mobile
          flutter pub get
          dart format lib test
          flutter analyze
          flutter test test/reference_visual_capture_test.dart
          cd ..

          git rm .github/workflows/vendor-mobile-capture-fonts.yml
      - name: Persist hermetic capture fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/pubspec.yaml mobile/test/reference_visual_capture_test.dart mobile/assets/fonts/Cairo-Regular.ttf mobile/assets/fonts/Cairo-Medium.ttf
          git commit -m 'fix(mobile): make reference capture font loading hermetic'
          git push origin HEAD:feat/alkenzy-mobile-reference-redesign
