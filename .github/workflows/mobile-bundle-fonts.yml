name: Mobile Bundle Fonts

on:
  push:
    branches:
      - feat/alkenzy-mobile-reference-redesign

permissions:
  contents: write

jobs:
  bundle-fonts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-reference-redesign
          fetch-depth: 0
      - name: Materialize pinned approved Cairo and Inter fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/assets/fonts

          fetch_blob() {
            local sha="$1"
            local output="$2"
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/google/fonts/git/blobs/${sha}" \
              | python3 -c 'import base64,json,sys; data=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(data["content"]))' \
              > "$output"
            test "$(git hash-object "$output")" = "$sha"
          }

          fetch_blob 25641b1c828857698457bcd9f5a102616b4e8033 mobile/assets/fonts/Cairo-Variable.ttf
          fetch_blob 047c92f6e2212473dc436020afed689527076d44 mobile/assets/fonts/Inter-Variable.ttf
      - name: Commit bundled fonts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/assets/fonts/Cairo-Variable.ttf mobile/assets/fonts/Inter-Variable.ttf
          if ! git diff --cached --quiet; then
            git commit -m 'assets(mobile): bundle approved Cairo and Inter fonts'
            git push origin HEAD:feat/alkenzy-mobile-reference-redesign
          fi
