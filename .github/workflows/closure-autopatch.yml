name: Focused report contracts and sounds closure

on:
  push:
    branches:
      - release/alkenzy-adv-0.3.12-full-convergence

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, '[closure-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/alkenzy-adv-0.3.12-full-convergence
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply focused production closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          # Materialize the owner-supplied ALKENZY report reference from the
          # source-controlled optimized derivative. It is a direct resize of
          # the supplied 1436x2048 JPEG, with no redesign.
          encoded = Path('mobile/assets/brand/report_background_480.b64')
          background = Path('mobile/assets/brand/report_background.jpg')
          raw = base64.b64decode(encoded.read_text().strip(), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '8435e52a54c731e2a0baaa184c9d5d1e84b1579da234d12cdd228df2d7b7b1bd'
          if digest != expected:
              raise SystemExit(f'report background checksum mismatch: {digest}')
          if not raw.startswith(b'\xff\xd8') or not raw.endswith(b'\xff\xd9'):
              raise SystemExit('report background is not a complete JPEG')
          background.write_bytes(raw)

          # Mobile contracts: accept the server-authoritative AP/AR direction
          # independently of counterparty type. Production notification rules
          # explicitly support customer+payable obligations, so rejecting an
          # otherwise valid row here can hide the entire contracts page.
          contracts_path = Path('mobile/lib/features/contracts/contracts.dart')
          contracts = contracts_path.read_text()
          marker = "const _supportedCounterpartyTypes = <String>{'customer', 'supplier'};\n"
          if 'const _supportedFinancialDirections' not in contracts:
              if marker not in contracts:
                  raise SystemExit('contracts type marker not found')
              contracts = contracts.replace(
                  marker,
                  marker + "const _supportedFinancialDirections = <String>{'receivable', 'payable'};\n",
                  1,
              )
          old_direction = """    if ((type == 'supplier' && direction != 'payable') ||\n        (type == 'customer' && direction != 'receivable')) {\n      throw const FormatException(\n        'contract.financial_direction conflicts with counterparty type.',\n      );\n    }\n"""
          new_direction = """    if (!_supportedFinancialDirections.contains(direction)) {\n      throw const FormatException('contract.financial_direction is invalid.');\n    }\n"""
          if old_direction in contracts:
              contracts = contracts.replace(old_direction, new_direction, 1)
          elif new_direction not in contracts:
              raise SystemExit('contract financial-direction validation block not found')
          contracts_path.write_text(contracts)

          screen_path = Path('mobile/lib/features/contracts/contracts_screen.dart')
          screen = screen_path.read_text()
          old_empty = """                  : context.scL10n.t('No contracts match the current filters.'),\n"""
          new_empty = """                  : (page.scope == 'assigned' &&\n                          controller.activeFilterCount == 0\n                      ? (context.scL10n.isArabic\n                          ? 'لا توجد عقود مسندة لهذا الحساب حاليًا.'\n                          : 'No contracts are currently assigned to this account.')\n                      : context.scL10n\n                          .t('No contracts match the current filters.')),\n"""
          if old_empty in screen:
              screen = screen.replace(old_empty, new_empty, 1)
          elif 'لا توجد عقود مسندة لهذا الحساب حاليًا.' not in screen:
              raise SystemExit('contracts empty-state marker not found')
          screen_path.write_text(screen)

          # Mobile reports: official portrait background, Arabic field labels,
          # and a dynamic title/date rendered over the supplied reference.
          report_path = Path('mobile/lib/features/export/mobile_report_export.dart')
          report = report_path.read_text()
          method_marker = "  Uint8List _xlsx(MobileReportData data) {\n"
          if 'String _reportHeaderLabel(String column)' not in report:
              helpers = """  String _reportHeaderLabel(String column) {\n    const labels = <String, String>{\n      'id': 'المعرف',\n      'contract_number': 'رقم العقد',\n      'counterparty_name': 'العميل / المورد',\n      'customer_name': 'العميل',\n      'supplier_name': 'المورد',\n      'financial_direction': 'نوع الدفعة',\n      'base_value': 'قيمة العقد',\n      'original_amount': 'المبلغ',\n      'paid_amount': 'المبلغ المدفوع',\n      'remaining_amount': 'المبلغ المتبقي',\n      'currency_code': 'العملة',\n      'reference': 'المرجع',\n      'due_date': 'تاريخ الاستحقاق',\n      'expected_payment_date': 'تاريخ الدفع المتوقع',\n      'start_date': 'تاريخ البداية',\n      'end_date': 'تاريخ النهاية',\n      'created_at': 'تاريخ الإنشاء',\n      'scheduled_for': 'موعد الإشعار',\n      'status': 'الحالة',\n      'internal_code': 'الكود الداخلي',\n      'name': 'الاسم',\n      'contact_name': 'جهة الاتصال',\n      'email': 'البريد الإلكتروني',\n      'phone': 'الهاتف',\n      'is_active': 'نشط',\n      'obligation_count': 'عدد الالتزامات',\n      'original_total': 'الإجمالي الأصلي',\n      'settled_total': 'إجمالي المسدد',\n      'outstanding_total': 'إجمالي المستحق',\n      'overdue_total': 'إجمالي المتأخر',\n      'due_today_total': 'مستحق اليوم',\n      'due_30_total': 'مستحق خلال 30 يومًا',\n      'media_id': 'معرف المرفق',\n      'label': 'العنوان',\n      'role': 'النوع',\n      'mime_type': 'نوع الملف',\n      'url': 'الرابط',\n      'payment_id': 'معرف الدفعة',\n      'template_code': 'قالب الإشعار',\n      'is_read': 'مقروء',\n    };\n    return labels[column] ?? column;\n  }\n\n  String _reportTitle(MobileReportType type) => switch (type) {\n        MobileReportType.contracts => 'تقرير العقود',\n        MobileReportType.payments => 'تقرير الدفعات',\n        MobileReportType.customers => 'تقرير العملاء',\n        MobileReportType.finance => 'التقرير المالي',\n        MobileReportType.attachments => 'تقرير المرفقات',\n        MobileReportType.notifications => 'تقرير الإشعارات',\n      };\n\n"""
              if method_marker not in report:
                  raise SystemExit('report xlsx marker not found')
              report = report.replace(method_marker, helpers + method_marker, 1)

          report = report.replace(
              "    final allRows = <List<String>>[data.columns, ...data.rows];\n",
              "    final allRows = <List<String>>[\n      data.columns.map(_reportHeaderLabel).toList(growable: false),\n      ...data.rows,\n    ];\n",
              1,
          )
          report = report.replace(
              "      '<w:tr>${data.columns.map((v) => wordCell(v, bold: true)).join()}</w:tr>',\n",
              "      '<w:tr>${data.columns.map(_reportHeaderLabel).map((v) => wordCell(v, bold: true)).join()}</w:tr>',\n",
              1,
          )

          pdf_start = report.index('  Future<Uint8List> _pdf(MobileReportData data) async {')
          pdf_end = report.index('  bool _containsArabic', pdf_start)
          new_pdf = r'''  Future<Uint8List> _pdf(MobileReportData data) async {
    final regular = pw.Font.ttf(
      await rootBundle.load('assets/fonts/Cairo-Regular.ttf'),
    );
    final medium = pw.Font.ttf(
      await rootBundle.load('assets/fonts/Cairo-Medium.ttf'),
    );
    final background = pw.MemoryImage(
      (await rootBundle.load('assets/brand/report_background.jpg'))
          .buffer
          .asUint8List(),
    );
    final generatedDate = DateTime.now().toIso8601String().substring(0, 10);
    final document = pw.Document();
    final limitedRows = data.rows.take(250).toList(growable: false);
    final reportColumns =
        data.columns.map(_reportHeaderLabel).toList(growable: false);

    pw.Widget cellText(String value, {required bool header}) {
      final rtl = _containsArabic(value);
      final rendered = rtl ? ArabicReshaper.instance.reshape(value) : value;
      return pw.Directionality(
        textDirection: rtl ? pw.TextDirection.rtl : pw.TextDirection.ltr,
        child: pw.Text(
          rendered,
          textDirection: rtl ? pw.TextDirection.rtl : pw.TextDirection.ltr,
          textAlign: rtl ? pw.TextAlign.right : pw.TextAlign.left,
          style: pw.TextStyle(
            font: header ? medium : regular,
            fontSize: header ? 5.5 : 4.9,
          ),
        ),
      );
    }

    pw.Widget rtlTitle(String value) {
      return pw.Directionality(
        textDirection: pw.TextDirection.rtl,
        child: pw.Text(
          ArabicReshaper.instance.reshape(value),
          textDirection: pw.TextDirection.rtl,
          textAlign: pw.TextAlign.center,
          style: pw.TextStyle(font: medium, fontSize: 14),
        ),
      );
    }

    final widths = <int, pw.TableColumnWidth>{
      for (var i = 0; i < reportColumns.length; i++)
        i: const pw.FlexColumnWidth(1),
    };

    document.addPage(
      pw.MultiPage(
        pageTheme: pw.PageTheme(
          pageFormat: PdfPageFormat.a4,
          margin: const pw.EdgeInsets.fromLTRB(48, 165, 48, 95),
          theme: pw.ThemeData.withFont(base: regular, bold: medium),
          buildBackground: (context) => pw.FullPage(
            ignoreMargins: true,
            child: pw.Stack(
              children: <pw.Widget>[
                pw.Positioned(
                  left: 0,
                  top: 0,
                  right: 0,
                  bottom: 0,
                  child: pw.Image(background, fit: pw.BoxFit.cover),
                ),
                // The owner reference contains a sample title/date. Cover only
                // that sample copy, preserving the supplied logo, frame and art.
                pw.Positioned(
                  left: 55,
                  right: 55,
                  top: 142,
                  height: 50,
                  child: pw.Container(color: PdfColor.fromInt(0xfffbfaf6)),
                ),
                // Replace the stale sample current-time line with live output.
                pw.Positioned(
                  right: 42,
                  bottom: 72,
                  width: 330,
                  height: 25,
                  child: pw.Container(color: PdfColor.fromInt(0xfffbfaf6)),
                ),
              ],
            ),
          ),
        ),
        header: (context) => pw.Padding(
          padding: const pw.EdgeInsets.only(bottom: 12),
          child: pw.Column(
            crossAxisAlignment: pw.CrossAxisAlignment.center,
            children: <pw.Widget>[
              rtlTitle(_reportTitle(data.type)),
              pw.SizedBox(height: 3),
              pw.Text(
                generatedDate,
                style: pw.TextStyle(font: regular, fontSize: 7),
              ),
            ],
          ),
        ),
        footer: (context) => pw.Align(
          alignment: pw.Alignment.centerRight,
          child: pw.Text(
            'Generated: $generatedDate • ${context.pageNumber}/${context.pagesCount}',
            style: pw.TextStyle(font: regular, fontSize: 6),
          ),
        ),
        build: (context) => <pw.Widget>[
          pw.Container(
            color: PdfColors.white,
            padding: const pw.EdgeInsets.all(4),
            child: pw.Table(
              columnWidths: widths,
              border: pw.TableBorder.all(width: 0.3),
              children: <pw.TableRow>[
                pw.TableRow(
                  children: reportColumns
                      .map(
                        (value) => pw.Padding(
                          padding: const pw.EdgeInsets.all(2),
                          child: cellText(value, header: true),
                        ),
                      )
                      .toList(growable: false),
                ),
                ...limitedRows.map(
                  (row) => pw.TableRow(
                    children: row
                        .map(
                          (value) => pw.Padding(
                            padding: const pw.EdgeInsets.all(2),
                            child: cellText(value, header: false),
                          ),
                        )
                        .toList(growable: false),
                  ),
                ),
              ],
            ),
          ),
        ],
      ),
    );
    return document.save();
  }

'''
          report = report[:pdf_start] + new_pdf + report[pdf_end:]
          report_path.write_text(report)

          # WordPress: wire the already implemented sound settings page and
          # its save action into the actual plugin bootstrap.
          plugin_path = Path('wordpress-plugin/safecontracts/src/Plugin.php')
          plugin = plugin_path.read_text()
          import_marker = 'use SafeContracts\\Admin\\NotificationSettingsPage;\n'
          sound_import = 'use SafeContracts\\Admin\\NotificationSoundSettingsPage;\n'
          if sound_import not in plugin:
              if import_marker not in plugin:
                  raise SystemExit('notification settings import marker not found')
              plugin = plugin.replace(import_marker, import_marker + sound_import, 1)
          menu_marker = "        add_action('admin_menu', [NotificationSettingsPage::class, 'register'], 32);\n"
          sound_menu = "        add_action('admin_menu', [NotificationSoundSettingsPage::class, 'register'], 33);\n"
          if sound_menu not in plugin:
              if menu_marker not in plugin:
                  raise SystemExit('notification settings menu marker not found')
              plugin = plugin.replace(menu_marker, menu_marker + sound_menu, 1)
          save_marker = "        add_action('admin_post_' . NotificationSettingsPage::SAVE_ACTION, [NotificationSettingsPage::class, 'handleSave']);\n"
          sound_save = "        add_action('admin_post_' . NotificationSoundSettingsPage::SAVE_ACTION, [NotificationSoundSettingsPage::class, 'handleSave']);\n"
          if sound_save not in plugin:
              if save_marker not in plugin:
                  raise SystemExit('notification settings save marker not found')
              plugin = plugin.replace(save_marker, save_marker + sound_save, 1)
          plugin_path.write_text(plugin)

          # Update the source contract test for the report implementation.
          report_test = Path('mobile/test/mobile_report_brand_portrait_test.dart')
          report_test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('PDF reports use the official ALKENZY portrait background and Arabic labels', () {\n    final report = File('lib/features/export/mobile_report_export.dart').readAsStringSync();\n\n    expect(report, contains(\"rootBundle.load('assets/brand/report_background.jpg')\"));\n    expect(report, contains('pageTheme: pw.PageTheme('));\n    expect(report, contains('pageFormat: PdfPageFormat.a4,'));\n    expect(report, isNot(contains('PdfPageFormat.a4.landscape')));\n    expect(report, contains('buildBackground: (context) => pw.FullPage('));\n    expect(report, contains(\"'contract_number': 'رقم العقد'\"));\n    expect(report, contains(\"'counterparty_name': 'العميل / المورد'\"));\n    expect(report, contains(\"'financial_direction': 'نوع الدفعة'\"));\n    expect(report, contains('ArabicReshaper.instance.reshape'));\n    expect(report, contains('pw.TextDirection.rtl'));\n  });\n}\n""")

          contracts_test = Path('mobile/test/contracts_scope_visibility_663_test.dart')
          contracts_test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('contracts remain visible for valid AP/AR direction and assigned scope is explicit', () {\n    final model = File('lib/features/contracts/contracts.dart').readAsStringSync();\n    final screen = File('lib/features/contracts/contracts_screen.dart').readAsStringSync();\n\n    expect(model, contains(\"const _supportedFinancialDirections = <String>{'receivable', 'payable'}\"));\n    expect(model, contains('contract.financial_direction is invalid.'));\n    expect(model, isNot(contains('contract.financial_direction conflicts with counterparty type.')));\n    expect(screen, contains(\"page.scope == 'assigned'\"));\n    expect(screen, contains('لا توجد عقود مسندة لهذا الحساب حاليًا.'));\n  });\n}\n""")

          checks = {
              background: [],
              contracts_path: ['_supportedFinancialDirections', 'contract.financial_direction is invalid.'],
              screen_path: ["page.scope == 'assigned'", 'لا توجد عقود مسندة لهذا الحساب حاليًا.'],
              report_path: ['assets/brand/report_background.jpg', 'buildBackground: (context) => pw.FullPage(', "'contract_number': 'رقم العقد'"],
              plugin_path: ['NotificationSoundSettingsPage', 'NotificationSoundSettingsPage::SAVE_ACTION'],
          }
          for path, needles in checks.items():
              if not path.exists():
                  raise SystemExit(f'missing closure file {path}')
              value = path.read_text(errors='ignore') if path.suffix != '.jpg' else ''
              for needle in needles:
                  if needle not in value:
                      raise SystemExit(f'missing closure marker {needle!r} in {path}')
          PY

      - name: Validate mobile closure
        working-directory: mobile
        run: |
          set -euo pipefail
          dart format lib/features/contracts/contracts.dart lib/features/contracts/contracts_screen.dart lib/features/export/mobile_report_export.dart test/mobile_report_brand_portrait_test.dart test/contracts_scope_visibility_663_test.dart
          flutter pub get
          flutter analyze
          flutter test

      - name: Validate plugin closure
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-plugin/safecontracts -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          grep -Fq 'use SafeContracts\Admin\NotificationSoundSettingsPage;' wordpress-plugin/safecontracts/src/Plugin.php
          grep -Fq "NotificationSoundSettingsPage::SAVE_ACTION" wordpress-plugin/safecontracts/src/Plugin.php
          test -s mobile/assets/brand/report_background.jpg
          test "$(sha256sum mobile/assets/brand/report_background.jpg | awk '{print $1}')" = "8435e52a54c731e2a0baaa184c9d5d1e84b1579da234d12cdd228df2d7b7b1bd"
          git diff --check

      - name: Commit validated closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ALKENZY Closure Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            mobile/assets/brand/report_background.jpg \
            mobile/lib/features/contracts/contracts.dart \
            mobile/lib/features/contracts/contracts_screen.dart \
            mobile/lib/features/export/mobile_report_export.dart \
            mobile/test/mobile_report_brand_portrait_test.dart \
            mobile/test/contracts_scope_visibility_663_test.dart \
            wordpress-plugin/safecontracts/src/Plugin.php
          if git diff --cached --quiet; then
            echo 'Closure already applied; nothing to commit.'
            exit 0
          fi
          git commit -m "Close report background contracts visibility and sound settings [closure-applied]"
          git push origin HEAD:release/alkenzy-adv-0.3.12-full-convergence
