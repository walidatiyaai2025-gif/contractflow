name: Build Alkenzy ADV Google Play AAB

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production Safe Contracts API base URL ending in /wp-json/safecontracts/v1/"
        required: true
        type: string

permissions:
  contents: read

jobs:
  google-play-aab:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require Google Play signing material
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SC_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SC_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.SC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "FAIL: production signing input $name is missing" >&2
              exit 1
            fi
          done

      - name: Validate production API URL
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ['API_BASE_URL'].strip()
          parsed = urlparse(url)
          if parsed.scheme != 'https' or not parsed.netloc:
              raise SystemExit('FAIL: production API URL must use HTTPS')
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('FAIL: production API URL must not contain credentials/query/fragment')
          if not parsed.path.rstrip('/').endswith('/wp-json/safecontracts/v1'):
              raise SystemExit('FAIL: production API URL must target /wp-json/safecontracts/v1/')
          PY

      - name: Bootstrap Android release scaffold
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SC_ANDROID_KEYSTORE_BASE64 }}
          SC_REQUIRE_PRODUCTION_ADMOB: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safecontracts-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/safecontracts-signing/release.jks"
          test -s "$RUNNER_TEMP/safecontracts-signing/release.jks"
          ./scripts/bootstrap_android.sh

      - name: Quality gate and build production-signed AAB
        working-directory: mobile
        shell: bash
        env:
          SC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/safecontracts-signing/release.jks
          SC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SC_ANDROID_KEYSTORE_PASSWORD }}
          SC_ANDROID_KEY_ALIAS: ${{ secrets.SC_ANDROID_KEY_ALIAS }}
          SC_ANDROID_KEY_PASSWORD: ${{ secrets.SC_ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build appbundle --release \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL="$API_BASE_URL"

      - name: Verify AAB signer and Play target contract
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.SC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB="mobile/build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          ACTUAL="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "FAIL: Google Play AAB signer does not match SC_ANDROID_CERT_SHA256" >&2
            cat "$RUNNER_TEMP/aab-cert.txt"
            exit 1
          fi
          grep -Fq 'targetSdk = maxOf(flutter.targetSdkVersion, 36)' mobile/android-release/app-build.gradle.kts
          cp "$AAB" Alkenzy-ADV-google-play.aab
          sha256sum Alkenzy-ADV-google-play.aab > Alkenzy-ADV-google-play.aab.sha256
          printf 'source_commit=%s\npackage=com.safecontracts.safecontracts_mobile\ntarget_api=36\nadmob_app_id=ca-app-pub-3218037275900725~7401372044\n' "$GITHUB_SHA" > ALKENZY-GOOGLE-PLAY-CANDIDATE.txt

      - name: Upload Google Play candidate
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-adv-google-play-aab-${{ github.sha }}
          path: |
            Alkenzy-ADV-google-play.aab
            Alkenzy-ADV-google-play.aab.sha256
            ALKENZY-GOOGLE-PLAY-CANDIDATE.txt
          if-no-files-found: error
          retention-days: 14
