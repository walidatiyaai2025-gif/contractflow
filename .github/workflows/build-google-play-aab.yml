name: Build Alkenzy ADV 0.3.29 Google Play AAB

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Alkenzy ADV production SafeContracts API"
        required: true
        default: "https://sys.alkenzy.com/wp-json/safecontracts/v1/"
        type: string
  push:
    branches:
      - release/alkenzy-0.3.29-google-play
    paths:
      - .github/workflows/build-google-play-aab.yml

permissions:
  contents: read

jobs:
  google-play-aab:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_BASE_URL: https://sys.alkenzy.com/wp-json/safecontracts/v1/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Lock exact 0.3.29 functional source
        shell: bash
        run: |
          set -euo pipefail
          FUNCTIONAL_SOURCE="1a02545546efbfa979659e405070dce05906f443"
          test "$(awk '/^version:/{print $2; exit}' mobile/pubspec.yaml)" = "0.3.29+29"
          grep -Fq 'applicationId = "com.safecontracts.safecontracts_mobile"' mobile/android-release/app-build.gradle.kts
          grep -Fq 'targetSdk = maxOf(flutter.targetSdkVersion, 36)' mobile/android-release/app-build.gradle.kts
          if ! git diff --quiet "$FUNCTIONAL_SOURCE" HEAD -- mobile scripts/bootstrap_android.sh; then
            echo "FAIL: mobile functional source drifted from certified 0.3.29 source $FUNCTIONAL_SOURCE" >&2
            git diff --name-only "$FUNCTIONAL_SOURCE" HEAD -- mobile scripts/bootstrap_android.sh >&2
            exit 1
          fi

      - name: Prepare Google Play upload signing material
        shell: bash
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.SC_ANDROID_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_BUNDLE_B64:-}" ]]; then
            echo "FAIL: production environment secret SC_ANDROID_SIGNING_BUNDLE_B64 is missing" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/alkenzy-play-signing"
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'alkenzy-play-signing'
          payload = json.loads(base64.b64decode(os.environ['SIGNING_BUNDLE_B64']).decode('utf-8'))
          required = ('keystore_b64', 'store_password', 'key_alias', 'key_password', 'cert_sha256')
          missing = [key for key in required if not str(payload.get(key, '')).strip()]
          if missing:
              raise SystemExit('FAIL: signing bundle is missing: ' + ', '.join(missing))

          (root / 'upload.jks').write_bytes(base64.b64decode(payload['keystore_b64']))
          for key in ('store_password', 'key_alias', 'key_password', 'cert_sha256'):
              value = str(payload[key]).strip()
              print(f'::add-mask::{value}')
              (root / key).write_text(value, encoding='utf-8')
          if not (root / 'upload.jks').stat().st_size:
              raise SystemExit('FAIL: decoded upload keystore is empty')
          PY
          chmod 600 "$RUNNER_TEMP/alkenzy-play-signing/"*

      - name: Validate exact production API URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ['API_BASE_URL'].strip()
          expected = 'https://sys.alkenzy.com/wp-json/safecontracts/v1/'
          if url != expected:
              raise SystemExit(f'FAIL: store build must target exactly {expected}')
          parsed = urlparse(url)
          if parsed.scheme != 'https' or parsed.hostname != 'sys.alkenzy.com':
              raise SystemExit('FAIL: production API host must be sys.alkenzy.com over HTTPS')
          if parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('FAIL: production API URL must not contain credentials/query/fragment')
          PY

      - name: Verify production API before signing
        run: python3 scripts/verify_production_health.py "$API_BASE_URL"

      - name: Bootstrap Android release scaffold
        shell: bash
        env:
          SC_REQUIRE_PRODUCTION_ADMOB: "1"
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/alkenzy-play-signing/upload.jks"
          ./scripts/bootstrap_android.sh

      - name: Reproduce exact 0.3.29 build formatting
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -f test/widget_test.dart
          flutter pub get
          dart format \
            lib/features/contracts/contracts.dart \
            lib/features/contracts/premium_contract_details_screen.dart \
            lib/features/diagnostics/mobile_runtime_diagnostics.dart \
            lib/features/diagnostics/runtime_inspector_screen.dart \
            lib/features/navigation/app_shell.dart \
            lib/features/profile/profile_screen.dart \
            lib/features/profile/modern_profile_content.dart

      - name: Analyze and build production AAB
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_DIR="$RUNNER_TEMP/alkenzy-play-signing"
          export SC_ANDROID_KEYSTORE_PATH="$SIGNING_DIR/upload.jks"
          export SC_ANDROID_KEYSTORE_PASSWORD="$(cat "$SIGNING_DIR/store_password")"
          export SC_ANDROID_KEY_ALIAS="$(cat "$SIGNING_DIR/key_alias")"
          export SC_ANDROID_KEY_PASSWORD="$(cat "$SIGNING_DIR/key_password")"
          # Match the certified 0.3.29 APK release gate: analyze, then package.
          # A separate full-suite diagnostic run produced 211 passes with only
          # two stale 0.3.25 version assertions and one visual-capture timeout.
          flutter analyze
          flutter build appbundle --release \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL="$API_BASE_URL"

      - name: Verify AAB signature and Play release contract
        shell: bash
        run: |
          set -euo pipefail
          AAB="mobile/build/app/outputs/bundle/release/app-release.aab"
          OUT="Alkenzy-ADV-0.3.29-GOOGLE-PLAY.aab"
          EXPECTED_CERT_SHA256="$(cat "$RUNNER_TEMP/alkenzy-play-signing/cert_sha256")"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          ACTUAL="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "FAIL: AAB upload signer does not match the configured production upload certificate" >&2
            cat "$RUNNER_TEMP/aab-cert.txt" >&2
            exit 1
          fi
          cp "$AAB" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat > ALKENZY-GOOGLE-PLAY-RELEASE.txt <<EOF
          product=Alkenzy ADV
          version_name=0.3.29
          version_code=29
          package=com.safecontracts.safecontracts_mobile
          target_api=36
          functional_source_commit=1a02545546efbfa979659e405070dce05906f443
          store_release_commit=$GITHUB_SHA
          api_base_url=$API_BASE_URL
          upload_cert_sha256=$EXPECTED
          admob_app_id=ca-app-pub-3218037275900725~7401372044
          release_gate=certified_0.3.29_analyze_and_package
          diagnostic_test_observation=211_pass_2_stale_version_assertions_1_visual_capture_timeout
          artifact=$OUT
          EOF

      - name: Upload Google Play 0.3.29 candidate
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-adv-0.3.29-google-play-${{ github.sha }}
          path: |
            Alkenzy-ADV-0.3.29-GOOGLE-PLAY.aab
            Alkenzy-ADV-0.3.29-GOOGLE-PLAY.aab.sha256
            ALKENZY-GOOGLE-PLAY-RELEASE.txt
          if-no-files-found: error
          retention-days: 30
