name: ESC P9-006 Contract Financial Reconciliation

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-financial-reconciliation:
    name: contract-financial-reconciliation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production

      - name: Validate P9-006 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialReconciliationRepository.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialReconciliationService.php
          php -l tests/php/enterprise_contract_financial_reconciliation_p9_006.php

      - name: Validate P9-006 financial reconciliation
        run: php tests/php/enterprise_contract_financial_reconciliation_p9_006.php
