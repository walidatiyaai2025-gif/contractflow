name: Bootstrap SafeContracts Package

on:
  push:
    branches: [main]
    paths:
      - .github/bootstrap-package/**
      - .github/workflows/bootstrap-package.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: safecontracts-initial-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild approved SafeContracts package
        run: |
          cat .github/bootstrap-package/payload.part*.b64 > /tmp/safecontracts_payload.b64
          base64 --decode /tmp/safecontracts_payload.b64 > /tmp/safecontracts_payload.tar.gz
          tar -xzf /tmp/safecontracts_payload.tar.gz -C .
          rm -rf .github/bootstrap-package
          rm -f .github/workflows/bootstrap-package.yml
      - name: Seed GitHub task issues from the approved plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/seed_plan_issues.py
      - name: Build the first live execution table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_project_status.py
      - name: Commit SafeContracts specification, assets, roadmap and live tracker
        run: |
          git config user.name "safecontracts-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: establish SafeContracts delivery baseline"
          git push
