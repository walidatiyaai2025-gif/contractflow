name: ALKENZY W5 Integration Ready

on:
  push:
    branches:
      - bugfix/alkenzy-w5-integration-ready

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/alkenzy-w5-integration-ready
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply validate and commit W5 closure
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=bootstrap
          fail() {
            rc=$?
            set +e
            printf 'stage=%s\nhead=%s\nexit=%s\n' "$stage" "$(git rev-parse HEAD)" "$rc" > .github/ALKENZY_W5_FAILURE.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ALKENZY_W5_FAILURE.txt
            git commit -m "ci(w5): record integration-ready failure at $stage" || true
            git push origin HEAD:bugfix/alkenzy-w5-integration-ready || true
            exit "$rc"
          }
          trap fail ERR

          stage=fetch-worker
          git fetch origin bugfix/alkenzy-register-w5-contracts-lists

          stage=restore-owned-files
          files=(
            mobile/lib/core/widgets/compact_pagination.dart
            mobile/lib/features/contracts/contracts.dart
            mobile/lib/features/contracts/contracts_screen.dart
            mobile/test/alkenzy_w5_b084_server_pagination_test.dart
            mobile/test/alkenzy_w5_b101_contract_tabs_test.dart
            mobile/test/mobile_contracts_011_test.dart
            mobile/test/mobile_contracts_validation_036_037_test.dart
            mobile/test/sc_p11_004_payment_pagination_test.dart
            tests/php/alkenzy_w5_pagination_contract.php
            tests/php/p10_security_financial_001_005.php
            tests/php/p10_validation_017_026.php
            tests/php/rest_api_016_017.php
            wordpress-plugin/safecontracts/src/Rest/ApiRequest.php
          )
          for f in "${files[@]}"; do
            git checkout origin/bugfix/alkenzy-register-w5-contracts-lists -- "$f"
          done

          stage=compose-backend
          mkdir -p /tmp/w5/wordpress-plugin/safecontracts/src/Counterparties /tmp/w5/wordpress-plugin/safecontracts/src/Rest
          git show origin/bugfix/alkenzy-register-w5-contracts-lists:wordpress-plugin/safecontracts/src/Counterparties/CounterpartyReadRepository.php > /tmp/w5/wordpress-plugin/safecontracts/src/Counterparties/CounterpartyReadRepository.php
          git show origin/bugfix/alkenzy-register-w5-contracts-lists:wordpress-plugin/safecontracts/src/Rest/DataController.php > /tmp/w5/wordpress-plugin/safecontracts/src/Rest/DataController.php
          python3 - <<'PY'
          from pathlib import Path

          def extract(text: str, start: str, end: str) -> str:
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          repo_path = Path('wordpress-plugin/safecontracts/src/Counterparties/CounterpartyReadRepository.php')
          current = repo_path.read_text()
          w5 = Path('/tmp/w5/wordpress-plugin/safecontracts/src/Counterparties/CounterpartyReadRepository.php').read_text()
          if 'use InvalidArgumentException;' not in current:
              current = current.replace('use DomainException;\n', 'use DomainException;\nuse InvalidArgumentException;\n', 1)
          page_block = extract(
              w5,
              '    /**\n     * Server-authoritative contract pagination.',
              '    /** @return list<array<string,mixed>> */\n    public function payments',
          )
          if 'public function contractPage(' not in current:
              marker = '    /** @return list<array<string,mixed>> */\n    public function payments'
              if marker not in current:
                  raise SystemExit('Counterparty payments marker missing')
              current = current.replace(marker, page_block + marker, 1)
          where_block = extract(
              w5,
              '    /** @return array{0:list<string>,1:list<int|string>} */\n    private function contractPageWhere',
              '    /** @return list<array<string,mixed>> */\n    private function rows',
          )
          if 'private function contractPageWhere(' not in current:
              marker = '    /** @return list<array<string,mixed>> */\n    private function rows'
              if marker not in current:
                  raise SystemExit('Counterparty rows marker missing')
              current = current.replace(marker, where_block + marker, 1)
          repo_path.write_text(current)

          data_path = Path('wordpress-plugin/safecontracts/src/Rest/DataController.php')
          current = data_path.read_text()
          w5 = Path('/tmp/w5/wordpress-plugin/safecontracts/src/Rest/DataController.php').read_text()
          contracts_start = '    public static function contracts(WP_REST_Request $request): WP_REST_Response|WP_Error'
          contract_detail_start = '    public static function contract(WP_REST_Request $request): WP_REST_Response|WP_Error'
          sa = w5.index(contracts_start)
          sb = w5.index(contract_detail_start, sa)
          da = current.index(contracts_start)
          db = current.index(contract_detail_start, da)
          current = current[:da] + w5[sa:sb] + current[db:]

          page_start = '    private static function page(array $rows, array $query): WP_REST_Response'
          search_marker = '    /** @param list<array<string,mixed>> $rows @return list<array<string,mixed>> */\n    private static function filterContractsBySearch'
          follow_marker = '    /** @param list<array<string,mixed>> $rows @param array<string,mixed> $filters @return list<array<string,mixed>> */\n    private static function filterFollowUps'
          sa = w5.index(page_start)
          sb = w5.index(search_marker, sa)
          da = current.index(page_start)
          db = current.index(follow_marker, da)
          current = current[:da] + w5[sa:sb] + current[db:]
          search_block = extract(w5, search_marker, follow_marker)
          if 'private static function filterContractsBySearch(' not in current:
              current = current.replace(follow_marker, search_block + follow_marker, 1)
          data_path.write_text(current)

          fixture = Path('tests/php/rest_api_validation_019_028.php')
          text = fixture.read_text()
          old = "$GLOBALS['sc_test_result_queue'] = [[[\n    'id' => '11', 'contract_number' => 'SC-11'"
          new = "$GLOBALS['sc_test_result_queue'] = [[['total' => '1']], [[\n    'id' => '11', 'contract_number' => 'SC-11'"
          count = text.count(old)
          if count == 2:
              text = text.replace(old, new)
          elif count != 0:
              raise SystemExit(f'unexpected contract fixture count={count}')
          fixture.write_text(text)

          test_script = Path('scripts/test-php.sh')
          text = test_script.read_text()
          line = 'php "$ROOT/tests/php/alkenzy_w5_pagination_contract.php"'
          if line not in text:
              text = text.rstrip() + '\n' + line + '\n'
          test_script.write_text(text)
          PY

          stage=php
          bash scripts/test-php.sh

          stage=dependencies
          cd mobile
          flutter pub get

          stage=format
          dart format lib test

          stage=analyze
          flutter analyze

          stage=tests
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
          cd ..

          stage=commit
          rm -f .github/workflows/alkenzy-w5-integration-ready.yml
          rm -f .github/ALKENZY_W5_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(w5): validate and stage server-backed contracts closure"
          git push origin HEAD:bugfix/alkenzy-w5-integration-ready
