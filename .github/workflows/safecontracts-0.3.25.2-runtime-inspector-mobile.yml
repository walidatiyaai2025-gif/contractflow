name: SafeContracts 0.3.25.2 Runtime Inspector + Mobile 0.3.28

on:
  push:
    branches:
      - fix/safecontracts-0.3.25.2-runtime-inspector

permissions:
  contents: read

jobs:
  build-inspector:
    runs-on: ubuntu-latest
    env:
      SC_PRODUCTION_API_BASE_URL: https://sys.alkenzy.com/wp-json/safecontracts/v1/
    steps:
      - uses: actions/checkout@v4

      - name: Validate and package plugin
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -m1 'Version:' wordpress-plugin/safecontracts/safecontracts.php | awk '{print $3}')" = "0.3.25.2"
          grep -q "RuntimeDiagnosticsController::register" wordpress-plugin/safecontracts/src/Rest/Router.php
          grep -q "RuntimeInspector::capture" wordpress-plugin/safecontracts/src/Rest/ContractDetailHotfix.php
          grep -q "Capabilities::MANAGE_SYSTEM" wordpress-plugin/safecontracts/src/Rest/RuntimeDiagnosticsController.php
          find wordpress-plugin/safecontracts -name '*.php' -print0 | xargs -0 -n1 php -l
          mkdir -p dist
          (cd wordpress-plugin && zip -qr ../dist/SafeContracts-0.3.25.2-RUNTIME-INSPECTOR.zip safecontracts)
          test -s dist/SafeContracts-0.3.25.2-RUNTIME-INSPECTOR.zip

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create APK signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/alkenzy-inspector.p12" \
            -storetype PKCS12 \
            -storepass inspector-only \
            -keypass inspector-only \
            -alias alkenzy-inspector \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=ALKENZY Runtime Inspector, OU=Diagnostics, O=ALKENZY, L=CI, ST=CI, C=US"
          {
            echo "SC_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/alkenzy-inspector.p12"
            echo "SC_ANDROID_KEYSTORE_PASSWORD=inspector-only"
            echo "SC_ANDROID_KEY_ALIAS=alkenzy-inspector"
            echo "SC_ANDROID_KEY_PASSWORD=inspector-only"
          } >> "$GITHUB_ENV"

      - name: Materialize Android release platform
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/materialize_notification_sounds.sh
          bash scripts/bootstrap_android.sh

      - name: Apply contract-detail mobile closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          contracts_path = Path('mobile/lib/features/contracts/contracts.dart')
          text = contracts_path.read_text(encoding='utf-8')
          api_import = "import '../../core/api/api_client.dart';"
          diag_import = "import '../diagnostics/mobile_runtime_diagnostics.dart';"
          if diag_import not in text:
              if api_import not in text:
                  raise SystemExit('contracts import marker missing')
              text = text.replace(api_import, api_import + '\n' + diag_import, 1)

          old_load = '''  Future<SafeContractsContract> loadContract(int id) async {
            if (id <= 0) throw ArgumentError('Contract ID must be positive.');
            final envelope = await client.get('contracts/$id');
            final contract = SafeContractsContract.fromData(envelope.data);
            if (contract.id != id) {
              throw const FormatException('Contract detail ID does not match request.');
            }
            return contract;
          }
'''
          new_load = '''  Future<SafeContractsContract> loadContract(int id) async {
            if (id <= 0) throw ArgumentError('Contract ID must be positive.');
            try {
              final envelope = await client.get('contracts/$id');
              final contract = SafeContractsContract.fromData(envelope.data);
              if (contract.id != id) {
                throw const FormatException(
                  'Contract detail ID does not match request.',
                );
              }
              return contract;
            } on SafeContractsApiException catch (error) {
              MobileRuntimeDiagnostics.record(
                operation: 'contract.detail',
                stage: 'direct.api',
                error: error,
                context: <String, Object?>{
                  'contract_id': id,
                  'status_code': error.statusCode,
                  'api_code': error.code,
                },
              );
              if (error.statusCode == 401 || error.statusCode == 403) rethrow;
              final fallback = await _loadContractFromList(id);
              if (fallback != null) return fallback;
              rethrow;
            } on Object catch (error) {
              MobileRuntimeDiagnostics.record(
                operation: 'contract.detail',
                stage: 'direct.parse',
                error: error,
                context: <String, Object?>{'contract_id': id},
              );
              final fallback = await _loadContractFromList(id);
              if (fallback != null) return fallback;
              rethrow;
            }
          }

          Future<SafeContractsContract?> _loadContractFromList(int id) async {
            try {
              final envelope = await client.get(
                'contracts',
                query: <String, String>{
                  'contract_id': '$id',
                  'page': '1',
                  'per_page': '1',
                  'sort': 'id',
                  'order': 'desc',
                },
              );
              final page = ContractPage.fromEnvelope(envelope);
              for (final contract in page.contracts) {
                if (contract.id == id) return contract;
              }
              MobileRuntimeDiagnostics.record(
                operation: 'contract.detail',
                stage: 'fallback.missing',
                error: StateError('Filtered contract list returned no exact match.'),
                context: <String, Object?>{
                  'contract_id': id,
                  'returned': page.contracts.length,
                },
              );
              return null;
            } on SafeContractsApiException catch (error) {
              MobileRuntimeDiagnostics.record(
                operation: 'contract.detail',
                stage: 'fallback.api',
                error: error,
                context: <String, Object?>{
                  'contract_id': id,
                  'status_code': error.statusCode,
                  'api_code': error.code,
                },
              );
              if (error.statusCode == 401 || error.statusCode == 403) rethrow;
              return null;
            } on Object catch (error) {
              MobileRuntimeDiagnostics.record(
                operation: 'contract.detail',
                stage: 'fallback.parse',
                error: error,
                context: <String, Object?>{'contract_id': id},
              );
              return null;
            }
          }
'''
          if old_load not in text:
              raise SystemExit('loadContract marker missing')
          text = text.replace(old_load, new_load, 1)

          old_open = '''    selectedContractId = id;
            selectedContract = null;
            detailErrorMessage = null;
            detailState = ContractDetailLoadState.loading;
            notifyListeners();
            try {
'''
          new_open = '''    final page = currentPage;
            if (page != null) {
              for (final cached in page.contracts) {
                if (cached.id == id) {
                  selectedContractId = id;
                  selectedContract = cached;
                  detailErrorMessage = null;
                  detailState = ContractDetailLoadState.ready;
                  notifyListeners();
                  return;
                }
              }
            }
            selectedContractId = id;
            selectedContract = null;
            detailErrorMessage = null;
            detailState = ContractDetailLoadState.loading;
            notifyListeners();
            try {
'''
          if old_open not in text:
              raise SystemExit('openContract marker missing')
          text = text.replace(old_open, new_open, 1)
          contracts_path.write_text(text, encoding='utf-8')

          inspector_path = Path('mobile/lib/features/diagnostics/runtime_inspector_screen.dart')
          inspector = inspector_path.read_text(encoding='utf-8')
          diag_screen_import = "import 'mobile_runtime_diagnostics.dart';"
          session_import = "import '../session/session_controller.dart';"
          if diag_screen_import not in inspector:
              if session_import not in inspector:
                  raise SystemExit('inspector import marker missing')
              inspector = inspector.replace(
                  session_import,
                  session_import + '\n' + diag_screen_import,
                  1,
              )
          card_marker = '''          _EnvironmentCard(
                    environment: snapshot.environment,
                    eventCount: snapshot.events.length,
                    isArabic: isArabic,
                  ),
                  const SizedBox(height: 12),
                  if (snapshot.events.isEmpty)
'''
          card_replacement = '''          _EnvironmentCard(
                    environment: snapshot.environment,
                    eventCount: snapshot.events.length,
                    isArabic: isArabic,
                  ),
                  const SizedBox(height: 12),
                  MobileDiagnosticsCard(isArabic: isArabic),
                  const SizedBox(height: 12),
                  if (snapshot.events.isEmpty)
'''
          if card_marker not in inspector:
              raise SystemExit('inspector card marker missing')
          inspector = inspector.replace(card_marker, card_replacement, 1)
          inspector_path.write_text(inspector, encoding='utf-8')
          PY

      - name: Analyze and build mobile inspector APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/{print $2; exit}' pubspec.yaml)" = "0.3.28+28"
          rm -f test/widget_test.dart
          flutter pub get
          dart format \
            lib/features/contracts/contracts.dart \
            lib/features/diagnostics/mobile_runtime_diagnostics.dart \
            lib/features/diagnostics/runtime_inspector_screen.dart \
            lib/features/profile/profile_screen.dart \
            lib/features/profile/modern_profile_content.dart
          flutter analyze
          flutter build apk --release \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL="$SC_PRODUCTION_API_BASE_URL"

      - name: Collect deliverables
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" dist/Alkenzy-ADV-0.3.28-CONTRACT-DETAIL-FIX.apk
          sha256sum \
            dist/SafeContracts-0.3.25.2-RUNTIME-INSPECTOR.zip \
            dist/Alkenzy-ADV-0.3.28-CONTRACT-DETAIL-FIX.apk \
            > dist/SHA256SUMS.txt
          printf 'plugin=0.3.25.2\nmobile=0.3.28+28\nfeature=admin-only-server-and-mobile-runtime-inspector\ncontract_detail_cached_fallback=enabled\ncontract_detail_filtered_fallback=enabled\napi=%s\nsource=%s\n' \
            "$SC_PRODUCTION_API_BASE_URL" "$GITHUB_SHA" > dist/BUILD.txt

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-contract-detail-fix-0.3.28
          path: |
            dist/SafeContracts-0.3.25.2-RUNTIME-INSPECTOR.zip
            dist/Alkenzy-ADV-0.3.28-CONTRACT-DETAIL-FIX.apk
            dist/SHA256SUMS.txt
            dist/BUILD.txt
          if-no-files-found: error
          retention-days: 14
