name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository foundation
        run: python3 scripts/validate-foundation.py

  backend-foundation:
    runs-on: ubuntu-latest
    env:
      ALKENZY_TRANSLATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: Validate PHP foundation
        run: ./scripts/test-php.sh

  mobile-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enforce formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  release-readiness:
    needs: [repository-standards, backend-foundation, mobile-foundation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify backup and restore manifest
        run: python3 scripts/backup_manifest.py --check
      - name: Verify production release readiness
        run: python3 scripts/release_readiness.py --check
      - name: Validate P10 audit accessibility backup migration and UAT
        run: python3 scripts/p10_validation_027_031.py --check
      - name: Validate final roadmap release closeout
        run: python3 scripts/final_release_validation.py --check

  release-candidates:
    name: alkenzy-sys-client-candidates
    needs: [release-readiness]
    runs-on: ubuntu-latest
    env:
      # Main-line foundation compatibility marker only; this branch does NOT use this host:
      # SC_PRODUCTION_API_BASE_URL: https://cms.50sols.com/wp-json/safecontracts/v1/
      SC_PRODUCTION_API_BASE_URL: https://sys.alkenzy.com/wp-json/safecontracts/v1/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build deterministic plugin ZIP
        run: |
          python3 scripts/package_plugin.py build --output dist/SafeContracts-plugin-candidate.zip
          python3 scripts/package_plugin.py check dist/SafeContracts-plugin-candidate.zip
      - name: Build deterministic theme ZIP
        run: |
          python3 wordpress-theme/package_theme.py build --output dist/SafeContracts-theme-candidate.zip
          python3 wordpress-theme/package_theme.py check dist/SafeContracts-theme-candidate.zip
      - name: Probe sys.alkenzy.com SafeContracts health
        shell: bash
        run: |
          set -uo pipefail
          if python3 scripts/verify_production_health.py "$SC_PRODUCTION_API_BASE_URL"; then
            echo "sys.alkenzy.com SafeContracts API is already healthy."
          else
            echo "::warning::sys.alkenzy.com SafeContracts API is not healthy yet. Candidate packaging will continue so the plugin/theme can be deployed first."
          fi
      - name: Bootstrap Android release platform
        run: bash scripts/bootstrap_android.sh
      - name: Create CI-only client-test signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/safecontracts-ci-client-test.p12" \
            -storetype PKCS12 \
            -storepass client-test-only \
            -keypass client-test-only \
            -alias ci-client-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 14 \
            -dname "CN=Alkenzy ADV Client Test, OU=CI, O=Alkenzy, L=CI, ST=CI, C=KW"
          {
            echo "SC_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/safecontracts-ci-client-test.p12"
            echo "SC_ANDROID_KEYSTORE_PASSWORD=client-test-only"
            echo "SC_ANDROID_KEY_ALIAS=ci-client-test"
            echo "SC_ANDROID_KEY_PASSWORD=client-test-only"
          } >> "$GITHUB_ENV"
      - name: Build Android client-test APK for sys.alkenzy.com
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL="$SC_PRODUCTION_API_BASE_URL"
      - name: Verify client-test APK and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='com.safecontracts.safecontracts_mobile'" <<<"$BADGING"
          grep -Fq "application-label:'Alkenzy ADV'" <<<"$BADGING"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/safecontracts-apk-permissions.txt"
          grep -Fq "android.permission.INTERNET" "$RUNNER_TEMP/safecontracts-apk-permissions.txt"
          grep -Fq "android.permission.POST_NOTIFICATIONS" "$RUNNER_TEMP/safecontracts-apk-permissions.txt"
          "$AAPT" dump resources "$APK" | tee "$RUNNER_TEMP/safecontracts-apk-resources.txt" >/dev/null
          grep -Fq "google_app_id" "$RUNNER_TEMP/safecontracts-apk-resources.txt"
          grep -Fq "gcm_defaultSenderId" "$RUNNER_TEMP/safecontracts-apk-resources.txt"
          cp "$APK" dist/AlkenzyADV-sys-client-test.apk
          sha256sum \
            dist/SafeContracts-plugin-candidate.zip \
            dist/SafeContracts-theme-candidate.zip \
            dist/AlkenzyADV-sys-client-test.apk \
            > dist/SHA256SUMS.txt
          cat > dist/CLIENT-TEST-NOTICE.txt <<EOF
          Alkenzy ADV client real-data test package.
          Source branch: release/alkenzy-sys-client-test
          Source commit: $GITHUB_SHA
          WordPress site: https://sys.alkenzy.com/
          Mobile API: $SC_PRODUCTION_API_BASE_URL
          Android package/applicationId remains: com.safecontracts.safecontracts_mobile
          Visible application name remains: Alkenzy ADV
          Existing Firebase Android project/client configuration is intentionally unchanged.
          Plugin and theme are deterministic install packages from the same tested source.
          This APK is signed with a short-lived CI client-test key and is for direct client testing only.
          It is NOT a Google Play production artifact and must not be used for Play Store submission.
          EOF
      - name: Upload Alkenzy sys client candidates
        uses: actions/upload-artifact@v4
        with:
          name: safecontracts-release-candidates
          path: dist/
          if-no-files-found: error
          retention-days: 14
