name: SafeContracts Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: safecontracts-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate repository standards
        run: bash scripts/validate-repository.sh

  mobile-foundation:
    name: Mobile foundation contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate mobile architecture boundary
        run: bash scripts/validate-mobile-foundation.sh

  php-foundation:
    name: PHP ${{ matrix.php }} foundation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PHP version
        run: php -v
      - name: Run PHP syntax and foundation tests
        run: bash scripts/test-php.sh
