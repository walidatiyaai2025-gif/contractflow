name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  repository-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository foundation
        run: python3 scripts/validate-foundation.py

  backend-foundation:
    runs-on: ubuntu-latest
    env:
      ALKENZY_TRANSLATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: Validate PHP foundation
        run: ./scripts/test-php.sh

  mobile-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enforce formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        shell: bash
        run: |
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"

  mobile-visual-closure:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/alkenzy-mobile-reference-redesign'
    needs: [mobile-foundation]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alkenzy-mobile-reference-redesign
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply bounded locked-reference closure deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          shell = Path('lib/features/navigation/app_shell.dart')
          text = shell.read_text()
          text = text.replace(
              'backgroundColor: SafeContractsVisual.surface,\n        selectedIndex:',
              'backgroundColor: SafeContractsVisual.navyDeep,\n        selectedIndex:',
              1,
          )
          text = text.replace(
              'floatingActionButtonLocation: FloatingActionButtonLocation.endFloat,',
              'floatingActionButtonLocation: FloatingActionButtonLocation.centerDocked,',
              1,
          )
          text = text.replace(
              '        case MobileDestination.payments:\n        case MobileDestination.followUps:',
              '        case MobileDestination.payments:\n        case MobileDestination.collections:\n        case MobileDestination.followUps:',
              1,
          )
          text = text.replace(
              '        case MobileDestination.collections:\n          break;\n',
              '',
              1,
          )
          text = text.replace(
              '      MobileDestination.payments => PaymentsScreen(',
              '      MobileDestination.payments || MobileDestination.collections =>\n          PaymentsScreen(',
              1,
          )
          text = text.replace(
              '      _ => _PlannedDestination(destination: _selected),\n',
              '',
              1,
          )
          text = re.sub(
              r'\nfinal class _PlannedDestination extends StatelessWidget \{.*?\n\}\n\nString _label',
              '\nString _label',
              text,
              count=1,
              flags=re.S,
          )
          shell.write_text(text)

          l10n = Path('lib/core/localization/safecontracts_localizations.dart')
          text = l10n.read_text()
          old = "return '$sign$whole.${cents.toString().padLeft(2, '0')}';"
          new = """if (cents == 0) return '$sign$whole';
  return '$sign$whole.${cents.toString().padLeft(2, '0')}';"""
          if old in text:
              text = text.replace(old, new, 1)
          additions = ''.join(
              line for line in (
                  "  'Suppliers': 'الموردون',\n",
                  "  'Finance': 'المالية',\n",
                  "  'Dashboard Two': 'لوحة تحكم اتنين',\n",
              )
              if line not in text
          )
          anchor = "  'Customers': 'العملاء',\n"
          if additions:
              if anchor not in text:
                  raise SystemExit('translation anchor missing')
              text = text.replace(anchor, anchor + additions, 1)
          l10n.write_text(text)

          capture = Path('test/reference_visual_capture_extended_test.dart')
          text = capture.read_text()
          old_supplier = """        'id': 8,
        'name': 'شركة الخليج للتوريدات',
        'internal_code': 'S-008',
        'contact_name': 'سالم حسن',
        'email': 'supplier@example.com',
        'phone': '+96550000008',
        'is_active': true,
"""
          new_supplier = """        'id': 8,
        'internal_code': 'S-008',
        'legal_name': 'شركة الخليج للتوريدات',
        'trading_name': 'الخليج للتوريدات',
        'contact_name': 'سالم حسن',
        'email': 'supplier@example.com',
        'phone': '+96550000008',
        'default_currency': 'KWD',
        'status': 'active',
        'is_archived': false,
"""
          if old_supplier in text:
              text = text.replace(old_supplier, new_supplier, 1)
          capture.write_text(text)
          PY
          dart format lib test
      - name: Analyze closure source
        run: flutter analyze
      - name: Test closure source
        shell: bash
        run: |
          mapfile -d '' tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'reference_visual_capture_test.dart' ! -name 'reference_visual_capture_extended_test.dart' ! -name 'worker1_visual_capture_test.dart' -print0 | sort -z)
          flutter test "${tests[@]}"
          flutter test test/reference_visual_capture_test.dart
          flutter test test/reference_visual_capture_extended_test.dart
      - name: Commit validated closure source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/navigation/app_shell.dart lib/core/localization/safecontracts_localizations.dart test/reference_visual_capture_extended_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'fix(mobile): align final locked-reference visual deltas'
            git push origin HEAD:feat/alkenzy-mobile-reference-redesign
          fi

  release-readiness:
    needs: [repository-standards, backend-foundation, mobile-foundation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify backup and restore manifest
        run: python3 scripts/backup_manifest.py --check
      - name: Verify production release readiness
        run: python3 scripts/release_readiness.py --check
      - name: Validate P10 audit accessibility backup migration and UAT
        run: python3 scripts/p10_validation_027_031.py --check
      - name: Validate final roadmap release closeout
        run: python3 scripts/final_release_validation.py --check

  release-candidates:
    name: release-candidates
    needs: [release-readiness]
    runs-on: ubuntu-latest
    env:
      SC_PRODUCTION_API_BASE_URL: https://sys.alkenzy.com/wp-json/safecontracts/v1/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build deterministic plugin ZIP
        run: |
          python3 scripts/package_plugin.py build --output dist/SafeContracts-plugin-candidate.zip
          python3 scripts/package_plugin.py check dist/SafeContracts-plugin-candidate.zip
      - name: Build deterministic theme ZIP
        run: |
          python3 wordpress-theme/package_theme.py build --output dist/SafeContracts-theme-candidate.zip
          python3 wordpress-theme/package_theme.py check dist/SafeContracts-theme-candidate.zip
      - name: Upload deterministic plugin and theme candidates
        uses: actions/upload-artifact@v4
        with:
          name: safecontracts-plugin-theme-candidates
          path: |
            dist/SafeContracts-plugin-candidate.zip
            dist/SafeContracts-theme-candidate.zip
          if-no-files-found: error
          retention-days: 14
      - name: Bootstrap Android release platform
        run: bash scripts/bootstrap_android.sh
      - name: Create CI-only candidate signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/safecontracts-ci-candidate.p12" \
            -storetype PKCS12 \
            -storepass candidate-only \
            -keypass candidate-only \
            -alias ci-candidate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=SafeContracts CI Candidate, OU=CI, O=SafeContracts, L=CI, ST=CI, C=US"
          {
            echo "SC_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/safecontracts-ci-candidate.p12"
            echo "SC_ANDROID_KEYSTORE_PASSWORD=candidate-only"
            echo "SC_ANDROID_KEY_ALIAS=ci-candidate"
            echo "SC_ANDROID_KEY_PASSWORD=candidate-only"
          } >> "$GITHUB_ENV"
      - name: Build Android release candidate
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=SC_ENV=production \
            --dart-define=SC_API_BASE_URL="$SC_PRODUCTION_API_BASE_URL"
      - name: Verify candidate APK and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/safecontracts-apk-permissions.txt"
          grep -Fq "android.permission.INTERNET" "$RUNNER_TEMP/safecontracts-apk-permissions.txt"
          grep -Fq "android.permission.POST_NOTIFICATIONS" "$RUNNER_TEMP/safecontracts-apk-permissions.txt"
          "$AAPT" dump resources "$APK" | tee "$RUNNER_TEMP/safecontracts-apk-resources.txt" >/dev/null
          grep -Fq "google_app_id" "$RUNNER_TEMP/safecontracts-apk-resources.txt"
          grep -Fq "gcm_defaultSenderId" "$RUNNER_TEMP/safecontracts-apk-resources.txt"

          LIBAPP="$(unzip -Z1 "$APK" | grep -E '^lib/[^/]+/libapp\.so$' | head -n 1)"
          test -n "$LIBAPP"
          unzip -p "$APK" "$LIBAPP" > "$RUNNER_TEMP/libapp.so"
          strings "$RUNNER_TEMP/libapp.so" > "$RUNNER_TEMP/libapp.strings"
          grep -Fq "sys.alkenzy.com" "$RUNNER_TEMP/libapp.strings"
          if grep -Fq "cms.50sols.com" "$RUNNER_TEMP/libapp.strings"; then
            echo "FAIL: APK still contains the retired cms.50sols.com production host" >&2
            exit 1
          fi

          cp "$APK" dist/Alkenzy-ADV-0.3.2-sys.alkenzy.com.apk
          sha256sum \
            dist/SafeContracts-plugin-candidate.zip \
            dist/SafeContracts-theme-candidate.zip \
            dist/Alkenzy-ADV-0.3.2-sys.alkenzy.com.apk \
            > dist/SHA256SUMS.txt
          cat > dist/CANDIDATE-NOTICE.txt <<EOF
          These files are release-engineering candidates from the exact CI source.
          Plugin version: 0.3.2
          Mobile version: 0.3.2+6
          APK production API: $SC_PRODUCTION_API_BASE_URL
          APK binary verification confirms sys.alkenzy.com is embedded and cms.50sols.com is absent.
          The APK manifest has android.permission.INTERNET and POST_NOTIFICATIONS.
          Firebase Android resources google_app_id and gcm_defaultSenderId are present.
          Mobile username/password login uses a server-issued opaque Bearer session token.
          The APK uses a short-lived CI-only signing key and is installable for validation only.
          Production publication still requires the production signing workflow and real-device/business UAT.
          EOF
      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-adv-0.3.2-release-candidates
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Verify sys.alkenzy.com SafeContracts health
        run: python3 scripts/verify_production_health.py "$SC_PRODUCTION_API_BASE_URL"
