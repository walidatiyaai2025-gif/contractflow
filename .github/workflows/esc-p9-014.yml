name: ESC P9-014 Schedule Settlement Reconciliation

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schedule-settlement:
    name: schedule-settlement
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production

      - name: Validate P9-014 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialScheduleSettlementPolicy.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialScheduleSettlementRepository.php
          php -l wordpress-plugin/safecontracts/src/Finance/ContractFinancialScheduleSettlementService.php
          php -l tests/php/enterprise_contract_financial_schedule_settlement_p9_014.php
          php -l tests/php/enterprise_contract_financial_collection_receipts_p9_013.php

      - name: Validate P9-013 compatibility
        run: php tests/php/enterprise_contract_financial_collection_receipts_p9_013.php

      - name: Validate P9-014 settlement reconciliation
        run: php tests/php/enterprise_contract_financial_schedule_settlement_p9_014.php
