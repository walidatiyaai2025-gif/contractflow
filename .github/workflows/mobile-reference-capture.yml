name: Mobile Reference Capture

on:
  pull_request:
    branches:
      - main
      - feat/alkenzy-0.3.2-premium-final

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Capture locked-reference implementation surfaces
        run: |
          flutter test test/reference_visual_capture_test.dart
          flutter test test/reference_visual_capture_extended_test.dart
      - name: Upload captures
        uses: actions/upload-artifact@v4
        with:
          name: alkenzy-mobile-reference-captures
          path: mobile/build/reference-captures/*.png
          if-no-files-found: error
          retention-days: 7
