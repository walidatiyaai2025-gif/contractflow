name: ESC P8-005 Contract Deliverables Gate

on:
  push:
    branches:
      - enterprise-safecontracts
  pull_request:
    branches:
      - enterprise-safecontracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-deliverables:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          ini-file: production
      - name: Validate P8-005 PHP syntax
        run: |
          php -l wordpress-plugin/safecontracts/src/Database/Migrations/Migration0047EnterpriseContractDeliverables.php
          php -l wordpress-plugin/safecontracts/src/Deliverables/ContractDeliverablePolicy.php
          php -l wordpress-plugin/safecontracts/src/Deliverables/ContractDeliverableRepository.php
          php -l wordpress-plugin/safecontracts/src/Deliverables/ContractDeliverableService.php
          php -l tests/php/enterprise_contract_deliverables_p8_005.php
      - name: Validate ESC-P8-005 Contract Deliverables foundation
        run: php tests/php/enterprise_contract_deliverables_p8_005.php
