name: WordPress Theme Quality

on:
  push:
    paths:
      - "wordpress-theme/**"
      - ".github/workflows/theme-quality.yml"
  pull_request:
    paths:
      - "wordpress-theme/**"
      - ".github/workflows/theme-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find wordpress-theme/safecontracts-onepage -name '*.php' -print0 \
            | xargs -0 -n1 php -l
      - name: Validate theme JSON and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool wordpress-theme/safecontracts-onepage/theme.json >/dev/null
          node --check wordpress-theme/safecontracts-onepage/assets/js/theme.js
      - name: Verify required public assets
        shell: bash
        run: |
          set -euo pipefail
          THEME="wordpress-theme/safecontracts-onepage"
          for asset in \
            hero-devices.svg \
            handshake.svg \
            reminders.svg \
            documents.svg \
            analytics.svg \
            security.svg \
            logo-mark.svg; do
            test -s "$THEME/assets/images/$asset"
          done
          test -s "$THEME/inc/brand.php"
          test -s "$THEME/assets/css/brand.css"
          grep -Fq "return 'Safe Contracts';" "$THEME/inc/brand.php"
          grep -Fq 'data:image/jpeg;base64,' "$THEME/inc/brand.php"
      - name: Verify bilingual one-page contract
        shell: bash
        run: |
          set -euo pipefail
          THEME="wordpress-theme/safecontracts-onepage"
          grep -Fq "'ar' => array(" "$THEME/inc/i18n.php"
          grep -Fq "'en' => array(" "$THEME/inc/i18n.php"
          grep -Fq 'id="home"' "$THEME/front-page.php"
          grep -Fq 'id="benefits"' "$THEME/front-page.php"
          grep -Fq 'id="use-cases"' "$THEME/front-page.php"
          grep -Fq 'id="dashboards"' "$THEME/front-page.php"
          grep -Fq 'id="faq"' "$THEME/front-page.php"
          grep -Fq 'id="contact"' "$THEME/front-page.php"
          grep -Fq 'prefers-reduced-motion' "$THEME/assets/css/theme.css"
          grep -Fq 'dir-rtl' "$THEME/assets/css/theme.css"
      - name: Verify homepage backend editor
        shell: bash
        run: |
          set -euo pipefail
          THEME="wordpress-theme/safecontracts-onepage"
          test -s "$THEME/inc/admin-settings.php"
          test -s "$THEME/inc/button-links.php"
          grep -Fq "safecontracts_copy_catalog" "$THEME/inc/i18n.php"
          grep -Fq "SafeContracts Home" "$THEME/inc/admin-settings.php"
          grep -Fq "safecontracts_home_content" "$THEME/inc/admin-settings.php"
          grep -Fq "safecontracts_theme_button_colors" "$THEME/inc/admin-settings.php"
          grep -Fq "safecontracts_apply_saved_button_colors" "$THEME/inc/admin-settings.php"
          grep -Fq "safecontracts_theme_button_links" "$THEME/inc/button-links.php"
          grep -Fq "Links / الروابط" "$THEME/inc/button-links.php"
          grep -Fq "safecontracts_button_link( 'header_demo' )" "$THEME/header.php"
          grep -Fq "safecontracts_button_link( 'header_login' )" "$THEME/header.php"
          grep -Fq "safecontracts_button_link( 'hero_primary' )" "$THEME/front-page.php"
          grep -Fq "safecontracts_button_link( 'hero_secondary' )" "$THEME/front-page.php"
          grep -Fq "safecontracts_button_link( 'final_cta' )" "$THEME/front-page.php"
          grep -Fq "inc/brand.php" "$THEME/functions.php"
          grep -Fq "inc/admin-settings.php" "$THEME/functions.php"
          grep -Fq "inc/button-links.php" "$THEME/functions.php"
      - name: Verify Safe Contracts backend identity
        shell: bash
        run: |
          set -euo pipefail
          THEME="wordpress-theme/safecontracts-onepage"
          test -s "$THEME/inc/admin-branding.php"
          test -s "$THEME/assets/css/admin.css"
          test -s "$THEME/assets/css/login.css"
          test -s "$THEME/assets/css/brand.css"
          grep -Fq "inc/admin-branding.php" "$THEME/functions.php"
          grep -Fq "admin_enqueue_scripts" "$THEME/inc/admin-branding.php"
          grep -Fq "login_enqueue_scripts" "$THEME/inc/admin-branding.php"
          grep -Fq "safecontracts_dashboard_overview" "$THEME/inc/admin-branding.php"
          grep -Fq "safecontracts_brand_icon_data_uri" "$THEME/inc/admin-branding.php"
          grep -Fq "safecontracts-admin-ui" "$THEME/assets/css/admin.css"
          grep -Fq "#adminmenu" "$THEME/assets/css/admin.css"
          grep -Fq "body.login" "$THEME/assets/css/login.css"
          grep -Fq "Theme Name: Safe Contracts One Page" "$THEME/style.css"
          grep -Fq "Version: 0.4.0" "$THEME/style.css"
      - name: Build deterministic installable theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 wordpress-theme/package_theme.py build --output dist/SafeContracts-OnePage-theme.zip
          python3 wordpress-theme/package_theme.py build --output dist/SafeContracts-OnePage-theme-repeat.zip
          cmp dist/SafeContracts-OnePage-theme.zip dist/SafeContracts-OnePage-theme-repeat.zip
          rm dist/SafeContracts-OnePage-theme-repeat.zip
          python3 wordpress-theme/package_theme.py check dist/SafeContracts-OnePage-theme.zip
          sha256sum dist/SafeContracts-OnePage-theme.zip > dist/SafeContracts-OnePage-theme.zip.sha256
          printf '%s\n' \
            "Safe Contracts One Page WordPress theme candidate" \
            "source_commit=$GITHUB_SHA" \
            "install_path=wp-content/themes/safecontracts-onepage" \
            "public_homepage=true" \
            "languages=ar,en" \
            "backend_editor=Appearance > SafeContracts Home" \
            "editable_button_links=true" \
            "admin_identity=Safe Contracts" \
            "login_identity=Safe Contracts" \
            > dist/THEME-CANDIDATE.txt
      - name: Upload installable theme candidate
        uses: actions/upload-artifact@v4
        with:
          name: safecontracts-wordpress-theme-candidate
          path: |
            dist/SafeContracts-OnePage-theme.zip
            dist/SafeContracts-OnePage-theme.zip.sha256
            dist/THEME-CANDIDATE.txt
          if-no-files-found: error
          retention-days: 14
