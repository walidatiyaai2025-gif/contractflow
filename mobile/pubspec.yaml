name: safecontracts_mobile
description: SafeContracts mobile API client foundation.
publish_to: none
version: 0.3.25+25

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  arabic_reshaper: ^0.0.1
  archive: ^3.6.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.2.1
  google_mobile_ads: ^7.0.0
  applovin_max: ^4.6.4
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  package_info_plus: ^8.0.2
  pdf: ^3.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/
