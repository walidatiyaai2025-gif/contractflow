name: safecontracts_mobile
description: SafeContracts mobile API client foundation.
publish_to: none
version: 0.3.7+11

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  arabic_reshaper: ^0.0.1
  archive: ^3.6.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/alkenzy_adv.png
    - assets/fonts/
