name: safecontracts_mobile
description: SafeContracts mobile API client foundation.
publish_to: none
version: 0.3.3+7

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_secure_storage: ^10.3.1
  google_fonts: ^6.2.1
  local_auth: ^3.0.1
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  archive: ^3.6.1
  share_plus: ^11.1.0
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/alkenzy_adv.png
    - assets/fonts/
